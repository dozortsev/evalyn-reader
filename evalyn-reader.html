<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Evalyn Reader</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌳</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:ital,wght@0,400;0,700;1,400&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700&family=Lexend:wght@300..700&display=swap" rel="stylesheet">
<style>
:root{
  --band: #F06FA8;
  --band-ink: #3A0E21;

  --bg: #FBFAF7;
  --ink: #1E2127;
  --ink-soft: #6E7480;
  --hover: rgba(30,33,39,.075);
  --hover-edge: rgba(30,33,39,.10);
  --hover-shadow: rgba(30,33,39,.10);
  --chrome: rgba(251,250,247,.94);
  --rule: rgba(30,33,39,.12);

  --size: 56px;
  --measure: 26ch;
  --spacing: .14em;
  --leading: 1.85;

  box-sizing: border-box;
}

:root[data-surface="evening"]{
  --bg: #171B21;
  --ink: #E9EAEC;
  --ink-soft: #8A919C;
  --hover: rgba(255,255,255,.10);
  --hover-edge: rgba(255,255,255,.14);
  --hover-shadow: rgba(0,0,0,.45);
  --chrome: rgba(23,27,33,.96);
  --rule: rgba(255,255,255,.14);
}

*,*::before,*::after{ box-sizing: inherit; }

html{ overflow-x: hidden; }
body{
  min-height: 100vh;
  min-height: 100dvh;
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Lexend", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
  touch-action: manipulation;
  transition: background-color .35s ease, color .35s ease;
}
body.locked{ overflow: hidden; }

/* ---------- stage ---------- */

#stage{
  display: block;
  min-height: 100vh;
  min-height: 100dvh;
  padding: clamp(24px,9vh,110px) clamp(16px,5vw,72px) 96px clamp(16px,6vw,96px);
  padding-top: calc(clamp(24px,9vh,110px) + env(safe-area-inset-top,0px));
}

#text{
  font-family: var(--face,"Andika"), Georgia, serif;
  font-size: min(var(--size), 11vw);
  line-height: var(--leading);
  letter-spacing: .012em;
  word-spacing: var(--spacing);
  max-width: min(var(--measure), 100%);
  margin: 0;
  overflow-wrap: break-word;
  overflow-wrap: anywhere;
}
#text p{ margin: 0 0 .85em; }
#text p:last-child{ margin-bottom: 0; }

/* ---------- words ---------- */

.w{
  display: inline-block;
  max-width: 100%;
  border-radius: .26em;
  padding: .02em .1em;
  margin: 0 -.06em;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  transition: background-color .2s ease, color .2s ease, opacity .28s ease,
              filter .28s ease, box-shadow .22s ease,
              transform .22s cubic-bezier(.2,.85,.3,1);
}

@media (hover: hover){
  .w:hover{
    background-color: var(--hover);
    box-shadow: 0 3px 14px -4px var(--hover-shadow), inset 0 0 0 1px var(--hover-edge);
    transform: translateY(-.028em);
  }
}
.w:active{ transform: translateY(0) scale(.985); }

.w.on{
  background-color: var(--band);
  color: var(--band-ink);
  box-shadow: 0 6px 22px -8px var(--band);
  transform: translateY(-.028em);
  opacity: 1 !important;
  filter: none !important;
}
.w:focus-visible{ outline: 3px solid var(--band); outline-offset: 2px; }

#text.dim .w{ opacity: .2; filter: blur(.055em); }
#text.dim .w.live{ opacity: 1; filter: none; }

/* ---------- word count ---------- */

#count{
  position: fixed;
  left: clamp(16px,6vw,96px);
  bottom: calc(16px + env(safe-area-inset-bottom,0px));
  font-size: 13px;
  letter-spacing: .04em;
  color: var(--ink-soft);
  pointer-events: none;
  z-index: 5;
}

/* ---------- scrim behind the settings sheet ---------- */

#scrim{
  position: fixed; inset: 0;
  background: rgba(0,0,0,.28);
  opacity: 0; pointer-events: none;
  transition: opacity .3s ease;
  touch-action: none;
  z-index: 25;
}
body.open #scrim{ opacity: 1; pointer-events: auto; }

/* ---------- settings: a sheet that drops down from the top ---------- */

#topbar{
  position: fixed;
  top: calc(env(safe-area-inset-top,0px) + 12px);
  right: calc(env(safe-area-inset-right,0px) + clamp(12px,3vw,24px));
  z-index: 35;
  display: flex; align-items: center; gap: 8px;
}

/* Reading | Maths switcher, the same height and type as the Settings button */
#modes{
  display: inline-flex; gap: 2px; padding: 3px;
  background: var(--chrome);
  -webkit-backdrop-filter: blur(14px) saturate(140%);
  backdrop-filter: blur(14px) saturate(140%);
  border: 1px solid var(--rule);
  border-radius: 999px;
}
#modes button{
  border: none; border-radius: 999px; background: transparent;
  font-size: 11.5px; letter-spacing: .05em; line-height: 1;
  color: var(--ink-soft);
  padding: 5px 11px;
}
#modes button:hover{ background: var(--hover); color: var(--ink); }
#modes button[aria-pressed="true"]{ background: var(--ink); color: var(--bg); }

#settingsBtn{
  display: inline-flex; align-items: center; gap: 7px;
  font-size: 11.5px; letter-spacing: .05em; line-height: 1;
  color: var(--ink-soft);
  background: var(--chrome);
  -webkit-backdrop-filter: blur(14px) saturate(140%);
  backdrop-filter: blur(14px) saturate(140%);
  border: 1px solid var(--rule);
  border-radius: 999px;
  padding: 8px 12px 8px 14px;
}
#settingsBtn:hover{ background: var(--chrome); color: var(--ink); }
#settingsBtn svg{ display: block; transition: transform .42s cubic-bezier(.32,.72,0,1); }
body.open #settingsBtn svg{ transform: rotate(180deg); }

#sheet{
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 30;
  max-height: calc(100vh - 24px);
  max-height: calc(100dvh - 24px);
  display: flex;
  flex-direction: column;
  background: var(--chrome);
  -webkit-backdrop-filter: blur(20px) saturate(150%);
  backdrop-filter: blur(20px) saturate(150%);
  border-bottom: 1px solid var(--rule);
  border-radius: 0 0 22px 22px;
  box-shadow: 0 22px 60px -24px rgba(0,0,0,.35);
  transform: translateY(calc(-100% - 48px));
  transition: transform .42s cubic-bezier(.32,.72,0,1);
}
body.open #sheet{ transform: translateY(0); }
#sheet.dragging{ transition: none; }

#panel{
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  width: 100%;
  max-width: 880px;
  margin: 0 auto;
  padding: calc(env(safe-area-inset-top,0px) + 58px) 0 4px;
  padding-left: calc(clamp(16px,4vw,32px) + env(safe-area-inset-left,0px));
  padding-right: calc(clamp(16px,4vw,32px) + env(safe-area-inset-right,0px));
  display: grid;
  gap: 13px;
  align-content: start;
}
.group{ display: flex; flex-direction: column; gap: 13px; min-width: 0; }

/* the grabber, like the bar on an iOS sheet: tap to close, or drag it up */
#grabber{
  flex: 0 0 auto;
  width: 100%;
  height: 30px;
  padding: 0;
  border: none;
  border-radius: 0 0 22px 22px;
  background: transparent;
  display: flex; align-items: center; justify-content: center;
  touch-action: none;
}
#grabber::before{
  content: "";
  width: 38px; height: 5px; border-radius: 3px;
  background: var(--ink-soft); opacity: .45;
  transition: opacity .15s ease;
}
#grabber:hover{ background: transparent; }
#grabber:hover::before{ opacity: .75; }

@media (min-width: 720px){
  #panel{
    grid-template-columns: minmax(0,1fr) minmax(0,1.35fr);
    column-gap: clamp(24px,4vw,48px);
  }
  #panel > hr{ display: none; }
}

button, select{
  font: inherit; font-size: 14px;
  color: var(--ink);
  background: transparent;
  border: 1px solid var(--rule);
  border-radius: 9px;
  padding: 10px 13px;
  cursor: pointer;
  transition: background-color .15s ease, border-color .15s ease;
}
button:hover, select:hover{ background: var(--hover); }
button:focus-visible, select:focus-visible, input:focus-visible{
  outline: 2px solid var(--band); outline-offset: 2px;
}
select{ width: 100%; }

#edit{
  background: var(--band);
  color: var(--band-ink);
  border-color: transparent;
  font-weight: 600; font-size: 16px; padding: 14px;
}
#edit:hover{ filter: brightness(1.06); }
#surface{ font-weight: 600; font-size: 16px; padding: 14px; }

.pair{ display:flex; gap: 8px; }
.pair > *{ flex: 1; min-width: 0; }

.field{ display:flex; flex-direction:column; gap: 5px; }
.field > span{ font-size: 11.5px; letter-spacing: .05em; color: var(--ink-soft); }
input[type=range]{ width: 100%; accent-color: var(--band); cursor: pointer; margin: 0; }

hr{ border:none; border-top:1px solid var(--rule); margin: 3px 0; }

#bands{ display:flex; gap: 9px; }
.band{
  flex: 1; height: 36px; border-radius: 9px;
  border: 2px solid transparent; cursor: pointer; padding: 0;
  transition: transform .15s ease, border-color .15s ease;
}
.band:hover{ transform: translateY(-2px); background: none; }
.band[aria-pressed="true"]{ border-color: var(--ink); }

/* ---------- editor ---------- */

#editor{
  position: fixed; inset: 0; z-index: 50;
  background: var(--bg);
  display: none; flex-direction: column;
  padding: clamp(16px,4vw,40px);
  padding-top: calc(clamp(16px,4vw,40px) + env(safe-area-inset-top,0px));
  padding-bottom: calc(clamp(16px,4vw,40px) + env(safe-area-inset-bottom,0px));
}
#editor.open{ display: flex; }
#editor header{
  display:flex; align-items:center; justify-content:space-between;
  gap: 16px; margin-bottom: 16px;
}
#editor h1{ font-family:"Andika",serif; font-size:22px; font-weight:700; margin:0; }
#back{
  border: 1px solid var(--rule); background: transparent; color: var(--ink-soft);
  font-size: 22px; line-height: 1; padding: 9px 16px; border-radius: 9px;
  flex: 0 0 auto;
}
#back:hover{ background: var(--hover); color: var(--ink); }
#src{
  flex: 1; width: 100%; min-height: 120px;
  font-family:"Andika",Georgia,serif;
  font-size: 17px; line-height: 1.7;
  color: var(--ink); background: transparent;
  border: 1px solid var(--rule); border-radius: 12px;
  padding: 14px 16px; resize: none;
  -webkit-appearance: none;
}
#editor .acts{ display:flex; gap:12px; margin-bottom:16px; align-items:stretch; }
#editor .acts > *{ flex: 1; min-width: 0; }
#save{
  background: var(--band); color: var(--band-ink);
  border-color: transparent; font-weight: 600; font-size: 16px;
  padding: 15px 24px;
}
#save:hover{ filter: brightness(1.06); }
#clear{ padding: 15px 24px; font-size: 16px; }

/* ---------- maths ---------- */

#maths{
  display: none;
  min-height: 100vh;
  min-height: 100dvh;
  padding: calc(env(safe-area-inset-top,0px) + 64px) 20px calc(env(safe-area-inset-bottom,0px) + 28px);
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: clamp(14px, 3vh, 34px);
  -webkit-user-select: none;
  user-select: none;
}
body.maths #maths{ display: flex; }
body.maths #stage,
body.maths #count,
body.maths .reading-only{ display: none !important; }
body:not(.maths) .maths-only{ display: none !important; }
.field .val{ float: right; font-weight: 600; color: var(--ink); letter-spacing: .02em; }

.sum{
  display: flex; align-items: center; justify-content: center;
  gap: .32em;
  font-family: "Andika", -apple-system, BlinkMacSystemFont, sans-serif;
  font-variant-numeric: lining-nums;
  font-size: min(150px, 20vh, calc((100vw - 40px) / var(--ems, 7)));
  line-height: 1;
  white-space: nowrap;
}
.answer{
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 1.6em; height: 1.3em; padding: 0 .18em;
  border: .05em solid var(--band);
  border-radius: .22em;
  transition: background-color .25s ease, color .25s ease;
}
.answer.empty::after{
  content: "";
  width: .05em; height: .78em; border-radius: .03em;
  background: var(--ink-soft);
  animation: caret 1.1s steps(1) infinite;
}
.answer.right{ background: var(--band); color: var(--band-ink); }
.answer.shake{ animation: shake .45s ease; }
@keyframes caret{ 50%{ opacity: 0; } }
@keyframes shake{
  20%{ transform: translateX(-.07em); }
  40%{ transform: translateX(.07em); }
  60%{ transform: translateX(-.04em); }
  80%{ transform: translateX(.04em); }
}

/* the space is tall enough for the thinking face to grow into: it grows
   upwards from its base, so the message and number pad never move */
#feedback{
  height: clamp(130px, 23vh, 240px);
  display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
  gap: 8px;
  text-align: center;
}
#feedback .emoji{
  font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
  font-size: clamp(64px, 12vh, 124px);
  line-height: 1;
  scale: var(--grow, 1);
  transform-origin: 50% 100%;
  transition: scale .35s cubic-bezier(.2,1.4,.4,1);
}
#feedback .msg{ font-size: clamp(16px, 2.4vh, 22px); font-weight: 600; }
#feedback.pop .emoji{ animation: pop .55s cubic-bezier(.2,1.5,.4,1) both; }
@keyframes pop{
  0%{ transform: scale(.3); opacity: 0; }
  60%{ transform: scale(1.12); opacity: 1; }
  100%{ transform: scale(1); }
}

#pad{
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  width: min(100%, 340px);
}
#pad button{
  height: clamp(56px, 8.5vh, 78px);
  font-family: "Andika", -apple-system, BlinkMacSystemFont, sans-serif;
  font-size: clamp(26px, 4vh, 34px);
  line-height: 1;
  border-radius: 16px;
  background: var(--chrome);
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  transition: transform .1s ease, background-color .15s ease;
}
#pad button:hover{ background: var(--hover); }
#pad button:active{ transform: scale(.95); }
#pad .ok{ background: var(--band); color: var(--band-ink); border-color: transparent; font-weight: 700; }
#pad .ok:hover{ background: var(--band); filter: brightness(1.06); }
#pad .del{ color: var(--ink-soft); }

/* short landscape phones: number pad beside the sum */
@media (orientation: landscape) and (max-height: 520px){
  body.maths #maths{
    display: grid;
    grid-template-columns: minmax(0,1fr) auto;
    align-content: center;
    justify-items: center;
    column-gap: 24px; row-gap: 8px;
    padding-top: calc(env(safe-area-inset-top,0px) + 52px);
    padding-bottom: calc(env(safe-area-inset-bottom,0px) + 12px);
  }
  .sum{ grid-column: 1; font-size: min(84px, calc((100vw - 420px) / var(--ems, 7))); }
  #feedback{ grid-column: 1; height: 150px; }
  #pad{ grid-column: 2; grid-row: 1 / span 2; width: 300px; }
  #pad button{ height: 54px; }
}

/* in maths mode the settings sheet only carries what maths uses */
@media (min-width: 720px){
  body.maths #panel{ grid-template-columns: minmax(0,1fr); max-width: 460px; }
}

@media (prefers-reduced-motion: reduce){
  *{ transition-duration:.01ms !important; animation-duration:.01ms !important; }
  .answer.empty::after{ animation: none; }
}

/* ---------- phones and narrow windows ---------- */

@media (max-width: 768px){
  #count{ left: 16px; }
  #editor .acts{ flex-direction: column; }
}
</style>
</head>
<body>

<div id="stage"><div id="text" aria-live="polite"></div></div>
<div id="count"></div>

<main id="maths" aria-label="Maths">
  <div class="sum" id="sum"></div>
  <div id="feedback" aria-live="polite"><span class="emoji"></span><span class="msg"></span></div>
  <div id="pad" role="group" aria-label="Number pad">
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
    <button data-k="del" class="del" aria-label="Delete">&#9003;</button>
    <button data-k="0">0</button>
    <button data-k="ok" class="ok" aria-label="Check">&#10003;</button>
  </div>
</main>

<div id="scrim"></div>

<div id="topbar">
  <div id="modes" role="group" aria-label="Mode">
    <button id="modeReading" aria-pressed="true">Reading</button>
    <button id="modeMaths" aria-pressed="false">Maths</button>
  </div>
  <button id="settingsBtn" aria-controls="sheet" aria-expanded="false">
    <span>Settings</span>
    <svg width="10" height="6" viewBox="0 0 10 6" aria-hidden="true"><path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
</div>

<div id="sheet" role="dialog" aria-modal="true" aria-label="Settings" inert>
  <div id="panel">
    <div class="group">
      <button id="edit" class="reading-only">Change text</button>
      <button id="surface">Evening</button>
      <div id="bands" role="group" aria-label="Highlight colour"></div>
    </div>

    <hr class="reading-only">

    <div class="group reading-only">
      <label class="field"><span>Speed</span><input id="rate" type="range" min=".4" max="1.2" step=".05" value=".8"></label>
      <label class="field"><span>Size</span><input id="size" type="range" min="24" max="120" step="2" value="56"></label>
      <label class="field"><span>Line width</span><input id="measure" type="range" min="10" max="60" step="1" value="26"></label>
      <label class="field"><span>Word gap</span><input id="gap" type="range" min="0" max="45" step="1" value="14"></label>
      <label class="field"><span>Line gap</span><input id="lead" type="range" min="130" max="260" step="5" value="185"></label>

      <label class="field"><span>Letterform</span>
        <select id="face">
          <option value="Andika">Andika — school letters</option>
          <option value="Atkinson Hyperlegible">Atkinson Hyperlegible</option>
          <option value="Lexend">Lexend</option>
          <option value="Georgia">Georgia</option>
        </select>
      </label>
    </div>

    <div class="group maths-only">
      <label class="field"><span>Complexity <b class="val" id="levelName"></b></span><input id="level" type="range" min="1" max="5" step="1" value="3"></label>
    </div>
  </div>
  <button id="grabber" aria-label="Close settings"></button>
</div>

<div id="editor">
  <header>
    <h1>Your text</h1>
    <button id="back" aria-label="Go back">&rarr;</button>
  </header>
  <div class="acts">
    <button id="save">Use this text</button>
    <button id="clear">Clear current text</button>
  </div>
  <textarea id="src" spellcheck="false"></textarea>
</div>

<script>
(function(){
"use strict";

var DEFAULT_TEXT =
"Fox had six socks.\n" +
"A big hen got one sock and ran off fast.\n\n" +
"Fox did not mind.\n" +
"Now Fox has five socks and a hen as a pal.";

var BANDS = [
  ["Pink","#F06FA8","#3A0E21"],
  ["Blue","#3D7CC9","#ffffff"],
  ["Turquoise","#2BAFA8","#04302E"]
];

var $ = function(id){ return document.getElementById(id); };
var root = document.documentElement;
var textEl = $("text");
var synth = window.speechSynthesis;

var readBtn = { textContent: "Read" };   /* label sink: the Read button was removed */
var tokens = [], sentences = [];
var current = -1, liveSentence = -1;
var reading = false, paused = false;
var timers = [];
var voice = null, primed = false;

function store(k,v){ try{ localStorage.setItem("evalyn:"+k, v); }catch(e){} }
function recall(k,d){ try{ var v = localStorage.getItem("evalyn:"+k); return v===null?d:v; }catch(e){ return d; } }

/* ---------------- text ---------------- */

function tokenize(text){
  tokens = []; sentences = [];
  textEl.innerHTML = "";

  var paras = text.split(/\n\s*\n/);
  var cursor = 0, sIdx = 0, map = {};

  paras.forEach(function(para){
    var pStart = text.indexOf(para, cursor);
    cursor = pStart + para.length;

    var p = document.createElement("p");
    var re = /\S+/g, m, lastEnd = pStart;

    while ((m = re.exec(para)) !== null){
      var start = pStart + m.index, end = start + m[0].length;
      if (start > lastEnd) p.appendChild(document.createTextNode(text.slice(lastEnd, start)));
      lastEnd = end;

      var span = document.createElement("span");
      span.className = "w";
      span.textContent = m[0];
      span.dataset.i = tokens.length;
      span.setAttribute("tabindex","0");
      p.appendChild(span);

      if (!map[sIdx]) map[sIdx] = { start:start, end:end, tokens:[] };
      map[sIdx].end = end;
      map[sIdx].tokens.push(tokens.length);
      tokens.push({ word:m[0], start:start, end:end, sentence:0, el:span });

      if (/[.!?\u2026]["'\u201d\u2019)\]]?$/.test(m[0])) sIdx++;
    }
    textEl.appendChild(p);
    sIdx++;
  });

  Object.keys(map).sort(function(a,b){ return a-b; }).forEach(function(k){
    var s = map[k];
    s.text = text.slice(s.start, s.end);
    s.index = sentences.length;
    s.tokens.forEach(function(ti){
      tokens[ti].sentence = sentences.length;
      tokens[ti].el.dataset.s = sentences.length;
    });
    sentences.push(s);
  });

  current = -1; liveSentence = -1;
  setLive(-1);
  updateCount();
}

function updateCount(){
  var n = tokens.length;
  $("count").textContent = (reading && current > -1)
    ? (current + 1) + " / " + n
    : n + (n === 1 ? " word" : " words");
}

/* ---------------- highlight and dim ---------------- */

function setLive(si){
  if (si === liveSentence) return;
  liveSentence = si;
  if (si < 0){
    textEl.classList.remove("dim");
    tokens.forEach(function(t){ t.el.classList.remove("live"); });
    return;
  }
  tokens.forEach(function(t){ t.el.classList.toggle("live", t.sentence === si); });
  textEl.classList.add("dim");
}

var smooth = !window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/* Auto-scroll is for touch devices only — iPad Air and phones. On the Mac
   and the TV the page stays where it is and the mouse does the scrolling. */
var touchScreen = window.matchMedia("(pointer: coarse), (max-width: 1180px)");

/* Put the tapped sentence in the middle of the screen. A later sentence
   therefore scrolls down, an earlier one scrolls back up. */
function centreSentence(si){
  if (!touchScreen.matches) return;
  var s = sentences[si];
  if (!s || !s.tokens.length) return;
  var first = tokens[s.tokens[0]].el.getBoundingClientRect();
  var last  = tokens[s.tokens[s.tokens.length - 1]].el.getBoundingClientRect();
  var top = first.top, height = last.bottom - first.top;
  var vh = window.innerHeight;
  var y = window.pageYOffset;

  /* a sentence taller than the screen can't be centred — sit its first line near the top */
  var target = (height > vh * 0.8)
    ? y + top - vh * 0.12
    : y + top + height / 2 - vh / 2;

  var max = Math.max(0, document.documentElement.scrollHeight - vh);
  target = Math.max(0, Math.min(target, max));
  if (Math.abs(target - y) < 8) return;

  try{ window.scrollTo({ top: target, behavior: smooth ? "smooth" : "auto" }); }
  catch(e){ window.scrollTo(0, target); }
}

function clearWord(){
  if (current > -1 && tokens[current]) tokens[current].el.classList.remove("on");
  current = -1;
}

function markWord(i){
  if (i === current) return;
  clearWord();
  if (!tokens[i]) return;
  current = i;
  tokens[i].el.classList.add("on");
  setLive(tokens[i].sentence);
  updateCount();
  if (reading){
    var r = tokens[i].el.getBoundingClientRect();
    if (r.top < 60 || r.bottom > window.innerHeight - 60){
      tokens[i].el.scrollIntoView({ block:"center", behavior: smooth ? "smooth" : "auto" });
    }
  }
}

/* ---------------- speech: Daniel, en-GB ---------------- */

function pickVoice(){
  if (!synth) return;
  var all = synth.getVoices();
  voice =
    all.find(function(v){ return /daniel/i.test(v.name) && /en[-_]GB/i.test(v.lang); }) ||
    all.find(function(v){ return /daniel/i.test(v.name); }) ||
    all.find(function(v){ return /en[-_]GB/i.test(v.lang); }) ||
    all.find(function(v){ return /^en/i.test(v.lang); }) || null;
}

/* iOS refuses to speak unless the first utterance follows a real tap */
function prime(){
  if (primed || !synth) return;
  primed = true;
  try{
    var u = new SpeechSynthesisUtterance(" ");
    u.volume = 0;
    synth.speak(u);
  }catch(e){}
}
document.addEventListener("pointerdown", prime, { once: true });
document.addEventListener("touchstart", prime, { once: true, passive: true });

function rate(){ return parseFloat($("rate").value); }

function stopAll(){
  timers.forEach(clearTimeout); timers = [];
  if (synth) synth.cancel();
  reading = false; paused = false;
  readBtn.textContent = "Read";
  updateCount();
}

function utter(text){
  var u = new SpeechSynthesisUtterance(text);
  if (voice) u.voice = voice;
  u.lang = voice ? voice.lang : "en-GB";
  u.rate = rate();
  return u;
}

function speakSentence(si, chain){
  if (!synth || si >= sentences.length){ stopAll(); clearWord(); setLive(-1); return; }
  var s = sentences[si];
  setLive(si);
  centreSentence(si);

  var u = utter(s.text), got = false;

  u.onboundary = function(e){
    if (e.name && e.name !== "word") return;
    got = true;
    var abs = s.start + (e.charIndex || 0);
    var idx = s.tokens.find(function(ti){ return tokens[ti].start <= abs && abs < tokens[ti].end; });
    if (idx === undefined) idx = s.tokens.find(function(ti){ return tokens[ti].start >= abs; });
    if (idx !== undefined) markWord(idx);
  };
  u.onstart = function(){
    setTimeout(function(){ if (!got && reading) fallback(s); }, 500);
  };
  u.onend = function(){
    if (!reading) return;
    timers.forEach(clearTimeout); timers = [];
    if (chain) speakSentence(si + 1, true);
    else { stopAll(); clearWord(); }
  };
  u.onerror = function(){ stopAll(); };

  synth.speak(u);
}

/* most iOS voices skip boundary events, so estimate word timings instead */
function fallback(s){
  var total = (s.text.length / (13.5 * rate())) * 1000;
  var w = s.tokens.map(function(ti){ return tokens[ti].word.length + 1; });
  var sum = w.reduce(function(a,b){ return a+b; }, 0), t = 0;
  s.tokens.forEach(function(ti, n){
    timers.push(setTimeout(function(){ if (reading) markWord(ti); }, t));
    t += (w[n] / sum) * total;
  });
}

function play(){
  if (!synth) return;
  if (reading && !paused){ synth.pause(); paused = true; readBtn.textContent = "Resume"; return; }
  if (reading && paused){ synth.resume(); paused = false; readBtn.textContent = "Pause"; return; }
  reading = true; paused = false;
  readBtn.textContent = "Pause";
  setSheet(false);
  speakSentence(current > -1 ? tokens[current].sentence : 0, true);
}

function speakWord(word){
  if (!synth || !word) return;
  synth.cancel();
  timers.forEach(clearTimeout); timers = [];
  reading = false; paused = false;
  readBtn.textContent = "Read";
  var u = utter(word);
  u.rate = Math.max(.35, rate() * .72);
  synth.speak(u);
}

function readSentence(si){
  if (synth) synth.cancel();
  timers.forEach(clearTimeout); timers = [];
  reading = true; paused = false;
  readBtn.textContent = "Pause";
  speakSentence(si, false);
}

/* ---------------- interaction ---------------- */

var pending = null, lastI = -1, lastTap = 0, hoverClear = null;
var pointerType = "mouse";

/* tracked per event rather than per device, so an iPad with a keyboard and
   trackpad still gets the mouse behaviour when a mouse is what's being used */
document.addEventListener("pointerdown", function(e){
  pointerType = e.pointerType || "mouse";
}, true);

function isTouch(){ return pointerType === "touch" || pointerType === "pen"; }

function clean(w){ return w.replace(/[^\w'\u2019-]/g, ""); }

textEl.addEventListener("click", function(e){
  var el = e.target.closest(".w");
  if (!el) return;
  var i = parseInt(el.dataset.i, 10);
  var si = parseInt(el.dataset.s, 10);
  var now = Date.now();

  /* Touch: silent. One tap isolates the sentence, two taps highlight the word.
     No delay on the first tap, because neither action needs undoing. */
  if (isTouch()){
    clearTimeout(hoverClear);
    if (i === lastI && now - lastTap < 600){   /* forgiving window — a 5-year-old double-taps slowly */
      lastI = -1; lastTap = 0;
      markWord(i);
    } else {
      lastI = i; lastTap = now;
      clearWord();
      setLive(si);
      updateCount();
    }
    centreSentence(si);
    return;
  }

  /* Mouse: one click speaks the word, two read the sentence. Double-click is
     detected here rather than via dblclick, which Safari fires unreliably. */
  if (i === lastI && now - lastTap < 330){
    clearTimeout(pending); pending = null;
    lastI = -1; lastTap = 0;
    markWord(i);
    readSentence(si);
    return;
  }

  lastI = i; lastTap = now;
  clearTimeout(hoverClear);
  setLive(si);
  centreSentence(si);

  clearTimeout(pending);
  pending = setTimeout(function(){
    pending = null;
    markWord(i);
    speakWord(clean(tokens[i].word));
  }, 260);
});

/* tapping the empty space around the text puts everything back */
$("stage").addEventListener("click", function(e){
  if (e.target.closest(".w") || reading) return;
  clearTimeout(pending); pending = null;
  lastI = -1; lastTap = 0;
  clearWord(); setLive(-1); updateCount();
});

textEl.addEventListener("mouseover", function(e){
  var el = e.target.closest(".w");
  if (!el || reading) return;
  clearTimeout(hoverClear);
  setLive(parseInt(el.dataset.s, 10));
});

textEl.addEventListener("mouseleave", function(){
  if (reading) return;
  hoverClear = setTimeout(function(){
    if (!reading){ clearWord(); setLive(-1); updateCount(); }
  }, 500);
});

textEl.addEventListener("touchstart", function(e){
  var el = e.target.closest(".w");
  if (!el) return;
  clearTimeout(hoverClear);
  setLive(parseInt(el.dataset.s, 10));
}, { passive: true });

textEl.addEventListener("keydown", function(e){
  var el = e.target.closest(".w");
  if (!el) return;
  if (e.key === "Enter" || e.key === " "){
    e.preventDefault();
    var i = parseInt(el.dataset.i, 10);
    markWord(i);
    speakWord(clean(tokens[i].word));
  }
});

/* like an iOS sheet: tap the grabber to close it, or drag it up and let go */
(function(){
  var sheet = $("sheet"), grab = $("grabber");
  var startY = 0, dy = 0, t0 = 0, dragging = false, moved = false;

  grab.addEventListener("touchstart", function(e){
    if (!sheetOpen()) return;
    dragging = true; moved = false; dy = 0;
    startY = e.touches[0].clientY; t0 = Date.now();
    sheet.classList.add("dragging");
  }, { passive: true });

  grab.addEventListener("touchmove", function(e){
    if (!dragging) return;
    e.preventDefault();
    dy = Math.min(0, e.touches[0].clientY - startY);   /* upwards only */
    if (dy < -6) moved = true;
    sheet.style.transform = "translateY(" + dy + "px)";
  }, { passive: false });

  function release(){
    if (!dragging) return;
    dragging = false;
    sheet.classList.remove("dragging");
    sheet.style.transform = "";
    var speed = -dy / Math.max(1, Date.now() - t0);   /* px per ms */
    if (-dy > Math.min(120, sheet.offsetHeight * 0.25) || (moved && speed > 0.6)) setSheet(false);
    setTimeout(function(){ moved = false; }, 400);
  }
  grab.addEventListener("touchend", release);
  grab.addEventListener("touchcancel", release);

  grab.addEventListener("click", function(){
    if (moved) return;   /* the end of a drag, not a tap */
    setSheet(false);
  });
})();

/* ---------------- maths ---------------- */

var YES_EMOJI = ["\u{1F389}","\u{1F31F}","\u{1F973}","\u{1F44F}","\u{1F984}","\u{1F680}","\u{1F3C6}","\u{1F308}"];
var YES_MSG   = ["Yes! You got it!", "Well done!", "Spot on!", "You worked it out!", "Brilliant!"];
var NO_EMOJI  = ["\u{1F914}"];   /* wrong answers: always the thinking face, so it reads clearly */
var NO_MSG    = ["Not quite. Have another go!", "Oops! Try again!", "Hmm, let's check again!"];

var M = { nums: [], ops: [], answer: 0, typed: "", tries: 0, locked: false, last: "", timer: null };

function rnd(a, b){ return a + Math.floor(Math.random() * (b - a + 1)); }
function pick(list){ return list[Math.floor(Math.random() * list.length)]; }

/* Five levels, set by the Complexity slider in Settings. Level 3 is the
   original mix. Higher levels use bigger numbers (9 − 7, 10 − 5) and longer
   chains (10 − 1 − 1). Nothing ever goes below zero, not even halfway through.
     mix   chance of 2, 3 or 4 numbers
     plus  ranges for a + b, and the largest answer allowed
     minus ranges for a − b (b is never bigger than a)
     m3/m4 first number and step size for 3- and 4-number chains, kept within mMax */
var LEVELS = {
  1: { name: "Up to 5",        mix: [0.9, 0.1, 0],
       plus: { a: [0, 5],  b: [0, 5],  max: 10 }, minus: { a: [0, 5],   b: [0, 5] },
       m3: { first: [0, 3],   step: [0, 2] }, m4: { first: [0, 2],   step: [0, 1] }, mMax: 6 },
  2: { name: "Within 10",      mix: [0.8, 0.15, 0.05],
       plus: { a: [0, 10], b: [0, 10], max: 10 }, minus: { a: [0, 10],  b: [0, 10] },
       m3: { first: [0, 5],   step: [0, 3] }, m4: { first: [0, 3],   step: [0, 2] }, mMax: 10 },
  3: { name: "Within 20",      mix: [0.8, 0.15, 0.05],
       plus: { a: [0, 10], b: [0, 10], max: 20 }, minus: { a: [0, 10],  b: [0, 10] },
       m3: { first: [0, 5],   step: [0, 5] }, m4: { first: [0, 3],   step: [0, 3] }, mMax: 10 },
  4: { name: "Bigger numbers", mix: [0.7, 0.2, 0.1],
       plus: { a: [3, 10], b: [3, 10], max: 20 }, minus: { a: [5, 10],  b: [3, 10] },
       m3: { first: [6, 10],  step: [1, 3] }, m4: { first: [6, 10],  step: [1, 2] }, mMax: 10 },
  5: { name: "Teens",          mix: [0.7, 0.2, 0.1],
       plus: { a: [6, 18], b: [2, 10], max: 20 }, minus: { a: [11, 20], b: [2, 13] },
       m3: { first: [10, 20], step: [1, 5] }, m4: { first: [10, 20], step: [1, 4] }, mMax: 20 }
};

function level(){ return LEVELS[parseInt($("level").value, 10)] || LEVELS[3]; }

function makeSum(){
  var L = level(), r = Math.random();
  var count = r < L.mix[0] ? 2 : (r < L.mix[0] + L.mix[1] ? 3 : 4);
  var nums = [], ops = [], total, a, b;

  if (count === 2){
    if (Math.random() < 0.55){
      a = rnd(L.plus.a[0], Math.min(L.plus.a[1], L.plus.max - L.plus.b[0]));
      b = rnd(L.plus.b[0], Math.min(L.plus.b[1], L.plus.max - a));
      ops.push("+"); total = a + b;
    } else {
      a = rnd(L.minus.a[0], L.minus.a[1]);
      b = rnd(L.minus.b[0], Math.min(L.minus.b[1], a));
      ops.push("\u2212"); total = a - b;
    }
    nums.push(a, b);
  } else {
    var m = count === 3 ? L.m3 : L.m4;
    total = rnd(m.first[0], Math.min(m.first[1], L.mMax));
    nums.push(total);
    for (var k = 1; k < count; k++){
      var canPlus = m.step[0] <= L.mMax - total, canMinus = m.step[0] <= total;
      var plus = canPlus && (!canMinus || total === 0 || Math.random() < 0.6);
      var n = plus ? rnd(m.step[0], Math.min(m.step[1], L.mMax - total))
                   : rnd(m.step[0], Math.min(m.step[1], total));
      ops.push(plus ? "+" : "\u2212");
      nums.push(n);
      total += plus ? n : -n;
    }
  }
  return { nums: nums, ops: ops, answer: total };
}

function answerBox(){ return $("sum").querySelector(".answer"); }

function renderTyped(){
  var box = answerBox();
  box.textContent = M.typed;
  box.classList.toggle("empty", M.typed === "");
}

/* builds "3 + 4 = [ ]" and sizes it so even four numbers fit on a phone */
function renderSum(){
  var el = $("sum"), ems = 0, parts = 0;
  el.innerHTML = "";
  function add(cls, text, width){
    var s = document.createElement("span");
    s.className = cls;
    s.textContent = text;
    el.appendChild(s);
    ems += width; parts++;
  }
  M.nums.forEach(function(n, i){
    if (i) add("op", M.ops[i - 1], 0.62);
    add("num", String(n), 0.58 * String(n).length);
  });
  add("op", "=", 0.62);
  add("answer", "", 1.75);
  ems += 0.32 * (parts - 1);
  el.style.setProperty("--ems", (ems * 1.06).toFixed(2));
  renderTyped();
}

function setFeedback(emoji, msg, grow){
  var f = $("feedback"), e = f.querySelector(".emoji");
  f.classList.remove("pop");
  void f.offsetWidth;   /* restart the pop animation */
  e.textContent = emoji;
  e.style.setProperty("--grow", grow || 1);
  f.querySelector(".msg").textContent = msg;
  if (emoji) f.classList.add("pop");
}

function newSum(){
  clearTimeout(M.timer);
  var s, key, guard = 0;
  do {
    s = makeSum();
    key = s.nums.join(",") + s.ops.join("");
  } while (key === M.last && ++guard < 20);
  M.last = key;
  M.nums = s.nums; M.ops = s.ops; M.answer = s.answer;
  M.typed = ""; M.tries = 0; M.locked = false;
  setFeedback("", "");
  renderSum();
}

function typeDigit(d){
  if (M.locked) return;
  if (M.typed === "0") M.typed = "";
  if (M.typed.length >= 2) return;
  M.typed += d;
  renderTyped();
}

function deleteDigit(){
  if (M.locked) return;
  M.typed = M.typed.slice(0, -1);
  renderTyped();
}

function checkAnswer(){
  if (M.locked || M.typed === "") return;
  var box = answerBox();
  M.locked = true;

  if (parseInt(M.typed, 10) === M.answer){
    box.classList.add("right");
    setFeedback(pick(YES_EMOJI), pick(YES_MSG));
    M.timer = setTimeout(newSum, 1700);
    return;
  }

  M.tries++;
  box.classList.remove("shake");
  void box.offsetWidth;
  box.classList.add("shake");

  /* as many goes as she needs, same sum, answer never shown.
     The thinking face grows a little with each try (capped) so every
     new attempt visibly registers. */
  setFeedback(NO_EMOJI[0], pick(NO_MSG), Math.min(1 + 0.12 * (M.tries - 1), 1.5));
  M.timer = setTimeout(function(){ M.typed = ""; renderTyped(); M.locked = false; }, 700);
}

$("pad").addEventListener("click", function(e){
  var b = e.target.closest("button");
  if (!b) return;
  var k = b.dataset.k;
  if (k === "del") deleteDigit();
  else if (k === "ok") checkAnswer();
  else typeDigit(k);
});

window.addEventListener("keydown", function(e){
  if (e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT") return;

  /* maths: type the answer on a keyboard too (handy on the Mac and the TV) */
  if (mode === "maths" && !sheetOpen() && !$("editor").classList.contains("open") &&
      !e.metaKey && !e.ctrlKey && !e.altKey){
    var onControl = e.target.closest && e.target.closest("button, select, a") && !e.target.closest("#pad");
    if (/^[0-9]$/.test(e.key)){ e.preventDefault(); typeDigit(e.key); return; }
    if (e.key === "Backspace"){ e.preventDefault(); deleteDigit(); return; }
    if (!onControl && (e.key === "Enter" || e.key === "=")){ e.preventDefault(); checkAnswer(); return; }
  }

  if (e.code === "Space"){ e.preventDefault(); if (mode === "reading") play(); }
  if (e.key === "Escape"){
    stopAll(); clearWord(); setLive(-1);
    if ($("editor").classList.contains("open")){
      $("editor").classList.remove("open");
      document.body.classList.remove("locked");
    } else {
      setSheet(false);
    }
  }
});

/* ---------------- start ---------------- */

if (synth){ pickVoice(); synth.onvoiceschanged = pickVoice; }
setBand(parseInt(recall("band","0"), 10) || 0);
tokenize(recall("text", DEFAULT_TEXT));
setSheet(false);
setMode(recall("mode", "reading"));

})();
</script>
