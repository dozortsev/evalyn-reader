<style>
:root{
  --band: #F06FA8;
  --band-ink: #3A0E21;

  --bg: #FBFAF7;
  --ink: #1E2127;
  --ink-soft: #6E7480;
  --hover: rgba(30,33,39,.075);
  --hover-edge: rgba(30,33,39,.10);
  --hover-shadow: rgba(30,33,39,.10);
  --chrome: rgba(251,250,247,.94);
  --rule: rgba(30,33,39,.12);
  --veil: rgba(251,250,247,.86);
  --track: rgba(30,33,39,.075);

  --size: 56px;
  --measure: 26ch;
  --spacing: .14em;
  --leading: 1.85;

  box-sizing: border-box;
}

:root[data-surface="evening"]{
  --bg: #171B21;
  --ink: #E9EAEC;
  --ink-soft: #8A919C;
  --hover: rgba(255,255,255,.10);
  --hover-edge: rgba(255,255,255,.14);
  --hover-shadow: rgba(0,0,0,.45);
  --chrome: rgba(23,27,33,.96);
  --rule: rgba(255,255,255,.14);
  --veil: rgba(23,27,33,.88);
  --track: rgba(255,255,255,.09);
}

*,*::before,*::after{ box-sizing: inherit; }

html{ overflow-x: hidden; }
body{
  min-height: 100vh;
  min-height: 100dvh;
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Lexend", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
  touch-action: manipulation;
  transition: background-color .35s ease, color .35s ease;
}
body.locked{ overflow: hidden; }

/* ---------- stage ---------- */

#stage{
  display: block;
  min-height: 100vh;
  min-height: 100dvh;
  padding: clamp(24px,9vh,110px) clamp(16px,5vw,72px) 96px clamp(16px,6vw,96px);
  padding-top: calc(clamp(24px,9vh,110px) + env(safe-area-inset-top,0px));
}

#text{
  font-family: var(--face,"Andika"), Georgia, serif;
  font-size: min(var(--size), 11vw);
  line-height: var(--leading);
  letter-spacing: .012em;
  word-spacing: var(--spacing);
  max-width: min(var(--measure), 100%);
  margin: 0;
  overflow-wrap: break-word;
  overflow-wrap: anywhere;
}
#text p{ margin: 0 0 .85em; }
#text p:last-child{ margin-bottom: 0; }

/* After the story: room for the last sentence to rise like the others,
   and a well done that pops up once she reaches it. */
#done{
  box-sizing: border-box;
  min-height: 75vh;
  font-family: var(--face,"Andika"), Georgia, serif;   /* the story's type, so its line width (in ch) matches */
  font-size: min(var(--size), 11vw);
  max-width: min(var(--measure), 100%);
  display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
  padding-top: clamp(32px, 8vh, 96px);
  text-align: center;
}
#done .inner{
  opacity: 0; transform: translateY(14px);
  transition: opacity .45s ease, transform .6s cubic-bezier(.2,1.3,.4,1);
}
#done.show .inner{ opacity: 1; transform: none; }
#done .badge{ position: relative; display: inline-block; font-size: clamp(60px, min(15vw, 15vh), 124px); line-height: 1; }
#done.show .badge{ animation: pop .7s cubic-bezier(.2,1.5,.4,1) both; }
#done .tick{ position: absolute; right: -.22em; bottom: -.04em; font-size: .44em; }
#done h2{
  margin: .4em 0 0;
  font-family: var(--face,"Andika"), Georgia, serif;
  font-size: clamp(26px, min(7vw, 7.5vh), 54px); font-weight: 700; line-height: 1.2;
  color: var(--ink);
}

/* ---------- words ---------- */

.w{
  display: inline-block;
  max-width: 100%;
  border-radius: .26em;
  padding: .02em .1em;
  margin: 0 -.06em;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  transition: background-color .2s ease, color .2s ease, opacity .28s ease,
              filter .28s ease, box-shadow .22s ease,
              transform .22s cubic-bezier(.2,.85,.3,1);
}

@media (hover: hover){
  .w:hover{
    background-color: var(--hover);
    box-shadow: 0 3px 14px -4px var(--hover-shadow), inset 0 0 0 1px var(--hover-edge);
    transform: translateY(-.028em);
  }
}
.w:active{ transform: translateY(0) scale(.985); }

.w.on{
  background-color: var(--band);
  color: var(--band-ink);
  box-shadow: 0 6px 22px -8px var(--band);
  transform: translateY(-.028em);
  opacity: 1 !important;
  filter: none !important;
}
.w:focus-visible{ outline: 3px solid var(--band); outline-offset: 2px; }

#text.dim .w{ opacity: .2; filter: blur(.055em); }
#text.dim .w.live{ opacity: 1; filter: none; }

/* ---------- word count ---------- */

#count{
  position: fixed;
  left: clamp(16px,6vw,96px);
  bottom: calc(16px + env(safe-area-inset-bottom,0px));
  font-size: 13px;
  letter-spacing: .04em;
  color: var(--ink-soft);
  pointer-events: none;
  z-index: 5;
}

/* ---------- scrim behind the settings sheet ---------- */

#scrim{
  position: fixed; inset: 0;
  background: rgba(0,0,0,.28);
  opacity: 0; pointer-events: none;
  transition: opacity .3s ease;
  touch-action: none;
  z-index: 25;
}
body.open #scrim{ opacity: 1; pointer-events: auto; }

/* ---------- settings: a sheet that drops down from the top ---------- */

#topbar{
  position: fixed;
  top: calc(env(safe-area-inset-top,0px) + 12px);
  right: calc(env(safe-area-inset-right,0px) + clamp(12px,3vw,24px));
  z-index: 35;
  display: flex; align-items: center; gap: 8px;
}

/* Reading | Maths | Words | Bedtime switcher, the same height and type as the Settings button */
#modes{
  display: inline-flex; gap: 2px; padding: 3px;
  background: var(--chrome);
  -webkit-backdrop-filter: blur(14px) saturate(140%);
  backdrop-filter: blur(14px) saturate(140%);
  border: 1px solid var(--rule);
  border-radius: 999px;
}
#modes button{
  border: none; border-radius: 999px; background: transparent;
  font-size: 11.5px; letter-spacing: .05em; line-height: 1;
  color: var(--ink-soft);
  padding: 5px 11px;
}
#modes button:hover{ background: var(--hover); color: var(--ink); }
#modes button[aria-pressed="true"]{ background: var(--ink); color: var(--bg); }

#settingsBtn{
  display: inline-flex; align-items: center; gap: 7px;
  font-size: 11.5px; letter-spacing: .05em; line-height: 1;
  color: var(--ink-soft);
  background: var(--chrome);
  -webkit-backdrop-filter: blur(14px) saturate(140%);
  backdrop-filter: blur(14px) saturate(140%);
  border: 1px solid var(--rule);
  border-radius: 999px;
  padding: 8px 12px 8px 14px;
}
#settingsBtn:hover{ background: var(--chrome); color: var(--ink); }
#settingsBtn svg{ display: block; transition: transform .42s cubic-bezier(.32,.72,0,1); }
body.open #settingsBtn svg{ transform: rotate(180deg); }

#sheet{
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 30;
  max-height: calc(100vh - 24px);
  max-height: calc(100dvh - 24px);
  display: flex;
  flex-direction: column;
  background: var(--chrome);
  -webkit-backdrop-filter: blur(20px) saturate(150%);
  backdrop-filter: blur(20px) saturate(150%);
  border-bottom: 1px solid var(--rule);
  border-radius: 0 0 22px 22px;
  box-shadow: 0 22px 60px -24px rgba(0,0,0,.35);
  transform: translateY(calc(-100% - 48px));
  transition: transform .42s cubic-bezier(.32,.72,0,1);
}
body.open #sheet{ transform: translateY(0); }
#sheet.dragging{ transition: none; }

#panel{
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  width: 100%;
  max-width: 880px;
  margin: 0 auto;
  padding: calc(env(safe-area-inset-top,0px) + 58px) 0 4px;
  padding-left: calc(clamp(16px,4vw,32px) + env(safe-area-inset-left,0px));
  padding-right: calc(clamp(16px,4vw,32px) + env(safe-area-inset-right,0px));
  display: grid;
  gap: 13px;
  align-content: start;
}
.group{ display: flex; flex-direction: column; gap: 13px; min-width: 0; }

/* the grabber, like the bar on an iOS sheet: tap to close, or drag it up */
#grabber{
  flex: 0 0 auto;
  width: 100%;
  height: 30px;
  padding: 0;
  border: none;
  border-radius: 0 0 22px 22px;
  background: transparent;
  display: flex; align-items: center; justify-content: center;
  touch-action: none;
}
#grabber::before{
  content: "";
  width: 38px; height: 5px; border-radius: 3px;
  background: var(--ink-soft); opacity: .45;
  transition: opacity .15s ease;
}
#grabber:hover{ background: transparent; }
#grabber:hover::before{ opacity: .75; }

@media (min-width: 720px){
  #panel{
    grid-template-columns: minmax(0,1fr) minmax(0,1.35fr);
    column-gap: clamp(24px,4vw,48px);
  }
  #panel > hr{ display: none; }
}

button, select{
  font: inherit; font-size: 14px;
  color: var(--ink);
  background: transparent;
  border: 1px solid var(--rule);
  border-radius: 9px;
  padding: 10px 13px;
  cursor: pointer;
  transition: background-color .15s ease, border-color .15s ease;
}
button:hover, select:hover{ background: var(--hover); }
button:focus-visible, select:focus-visible, input:focus-visible{
  outline: 2px solid var(--band); outline-offset: 2px;
}
select{ width: 100%; }

#edit{
  background: var(--band);
  color: var(--band-ink);
  border-color: transparent;
  font-weight: 600; font-size: 16px; padding: 14px;
}
#edit:hover{ filter: brightness(1.06); }
#surface{ font-weight: 600; font-size: 16px; padding: 14px; }

.pair{ display:flex; gap: 8px; }
.pair > *{ flex: 1; min-width: 0; }

.field{ display:flex; flex-direction:column; gap: 5px; }
.field > span{ font-size: 11.5px; letter-spacing: .05em; color: var(--ink-soft); }
input[type=range]{ width: 100%; accent-color: var(--band); cursor: pointer; margin: 0; }

hr{ border:none; border-top:1px solid var(--rule); margin: 3px 0; }

#bands{ display:flex; gap: 9px; }
.band{
  flex: 1; height: 36px; border-radius: 9px;
  border: 2px solid transparent; cursor: pointer; padding: 0;
  transition: transform .15s ease, border-color .15s ease;
}
.band:hover{ transform: translateY(-2px); background: none; }
.band[aria-pressed="true"]{ border-color: var(--ink); }

/* ---------- editor ---------- */

#editor{
  position: fixed; inset: 0; z-index: 50;
  background: var(--bg);
  display: none; flex-direction: column;
  padding: clamp(16px,4vw,40px);
  padding-top: calc(clamp(16px,4vw,40px) + env(safe-area-inset-top,0px));
  padding-bottom: calc(clamp(16px,4vw,40px) + env(safe-area-inset-bottom,0px));
}
#editor.open{ display: flex; }
#editor header{
  display:flex; align-items:center; justify-content:space-between;
  gap: 16px; margin-bottom: 16px;
}
#editor h1{ font-family:"Andika",serif; font-size:22px; font-weight:700; margin:0; }
#back{
  border: 1px solid var(--rule); background: transparent; color: var(--ink-soft);
  font-size: 22px; line-height: 1; padding: 9px 16px; border-radius: 9px;
  flex: 0 0 auto;
}
#back:hover{ background: var(--hover); color: var(--ink); }
#src{
  flex: 1; width: 100%; min-height: 120px;
  font-family:"Andika",Georgia,serif;
  font-size: 17px; line-height: 1.7;
  color: var(--ink); background: transparent;
  border: 1px solid var(--rule); border-radius: 12px;
  padding: 14px 16px; resize: none;
  -webkit-appearance: none;
}
#editor .acts{ display:flex; gap:12px; margin-bottom:16px; align-items:stretch; }
#editor .acts > *{ flex: 1; min-width: 0; }
#save{
  background: var(--band); color: var(--band-ink);
  border-color: transparent; font-weight: 600; font-size: 16px;
  padding: 15px 24px;
}
#save:hover{ filter: brightness(1.06); }
#clear{ padding: 15px 24px; font-size: 16px; }

/* ---------- maths ---------- */

#maths{
  display: none;
  min-height: 100vh;
  min-height: 100dvh;
  padding: calc(env(safe-area-inset-top,0px) + 64px) 20px calc(env(safe-area-inset-bottom,0px) + 28px);
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: clamp(14px, 3vh, 34px);
  -webkit-user-select: none;
  user-select: none;
}
body.maths #maths{ display: flex; }
body.maths #stage,
body.maths #count,
body.maths .reading-only{ display: none !important; }
body:not(.maths) .maths-only{ display: none !important; }
.field .val{ float: right; font-weight: 600; color: var(--ink); letter-spacing: .02em; }

.sum{
  display: flex; align-items: center; justify-content: center;
  gap: .32em;
  font-family: "Andika", -apple-system, BlinkMacSystemFont, sans-serif;
  font-variant-numeric: lining-nums;
  font-size: min(150px, 20vh, calc((100vw - 40px) / var(--ems, 7)));
  line-height: 1;
  white-space: nowrap;
}
.answer{
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 1.6em; height: 1.3em; padding: 0 .18em;
  border: .05em solid var(--band);
  border-radius: .22em;
  transition: background-color .25s ease, color .25s ease;
}
.answer.empty::after{
  content: "";
  width: .05em; height: .78em; border-radius: .03em;
  background: var(--ink-soft);
  animation: caret 1.1s steps(1) infinite;
}
.answer.right{ background: var(--band); color: var(--band-ink); }
.answer.shake{ animation: shake .45s ease; }
@keyframes caret{ 50%{ opacity: 0; } }
@keyframes shake{
  20%{ transform: translateX(-.07em); }
  40%{ transform: translateX(.07em); }
  60%{ transform: translateX(-.04em); }
  80%{ transform: translateX(.04em); }
}

/* the space is tall enough for the thinking face to grow into: it grows
   upwards from its base, so the message and number pad never move */
#feedback{
  height: clamp(120px, 20vh, 220px);
  display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
  gap: 8px;
  text-align: center;
}
#feedback .emoji{
  font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
  font-size: clamp(64px, 12vh, 124px);
  line-height: 1;
  scale: var(--grow, 1);
  transform-origin: 50% 100%;
  transition: scale .35s cubic-bezier(.2,1.4,.4,1);
}
#feedback .msg{ font-size: clamp(16px, 2.4vh, 22px); font-weight: 600; }
#feedback.pop .emoji{ animation: pop .55s cubic-bezier(.2,1.5,.4,1) both; }
@keyframes pop{
  0%{ transform: scale(.3); opacity: 0; }
  60%{ transform: scale(1.12); opacity: 1; }
  100%{ transform: scale(1); }
}

#pad{
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  width: min(100%, 340px);
}
#pad button{
  height: clamp(52px, 7.5vh, 76px);
  font-family: "Andika", -apple-system, BlinkMacSystemFont, sans-serif;
  font-size: clamp(26px, 4vh, 34px);
  line-height: 1;
  border-radius: 16px;
  background: var(--chrome);
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  transition: transform .1s ease, background-color .15s ease;
}
#pad button:hover{ background: var(--hover); }
#pad button:active{ transform: scale(.95); }
/* last two rows: a double-width 0 beside delete, then = across the whole width */
#pad .ok{ grid-column: 1 / -1; background: var(--band); color: var(--band-ink); border-color: transparent; font-weight: 700; }
#pad .ok:hover{ background: var(--band); filter: brightness(1.06); }
#pad button[data-k="0"]{ grid-column: span 2; }
#pad .del{ color: var(--ink-soft); }

/* landscape screens up to 900px tall (phones, iPad, laptop): number pad
   beside the sum, so the five rows of buttons always fit */
@media (orientation: landscape) and (max-height: 900px){
  body.maths #maths{
    display: grid;
    grid-template-columns: minmax(0,1fr) auto;
    align-content: center;
    justify-items: center;
    column-gap: clamp(24px, 5vw, 72px); row-gap: 8px;
    padding-top: calc(env(safe-area-inset-top,0px) + 52px);
    padding-bottom: calc(env(safe-area-inset-bottom,0px) + 12px);
  }
  .sum{ grid-column: 1; font-size: min(150px, 18vh, calc((100vw - 460px) / var(--ems, 7))); }
  #feedback{ grid-column: 1; }
  #pad{ grid-column: 2; grid-row: 1 / span 2; width: clamp(280px, 30vw, 360px); }
  #pad button{ height: clamp(48px, 9.5vh, 76px); }
}

/* ---------- words: a globe of words to spin, zoom and pick from ---------- */

#words{
  display: none;
  position: fixed; inset: 0;
  overflow: hidden;
  touch-action: none;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
body.words{ overflow: hidden; }
body.words #words{ display: block; }
body.words #stage,
body.words #count,
body.words .reading-only{ display: none !important; }

#globe{
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  display: block;
  touch-action: none;
  cursor: grab;
}
#globe.grabbing{ cursor: grabbing; }

/* the picked word, big and clear in the middle, to copy onto paper */
#wordCard{
  position: absolute; inset: 0;
  z-index: 2;
  display: flex; align-items: center; justify-content: center;
  padding: 24px;
  background: var(--veil);
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
  opacity: 0; visibility: hidden;
  transition: opacity .25s ease, visibility 0s linear .25s;
  touch-action: none;
  cursor: pointer;
}
#wordCard.show{ opacity: 1; visibility: visible; transition: opacity .25s ease; }
#wordBig{
  font-family: "Andika", -apple-system, BlinkMacSystemFont, sans-serif;
  font-size: 120px;             /* set in JS so every word fits the screen */
  line-height: 1.25;
  color: var(--ink);
  white-space: nowrap;
  transform-origin: 50% 50%;
  transition: transform .6s cubic-bezier(.2,.9,.25,1);
}

/* Random: hidden while the globe spins, and for a few seconds after */
#wordRandom{
  position: absolute; left: 50%;
  bottom: calc(env(safe-area-inset-bottom,0px) + clamp(18px, 4vh, 40px));
  z-index: 3;
  transform: translateX(-50%);
  font-size: 20px; font-weight: 600; letter-spacing: .02em; line-height: 1;
  white-space: nowrap;
  padding: 17px 32px;
  border: none; border-radius: 999px;
  background: var(--band); color: var(--band-ink);
  box-shadow: 0 14px 32px -14px var(--band), 0 2px 10px rgba(0,0,0,.12);
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  transition: opacity .3s ease, transform .35s cubic-bezier(.2,1.3,.4,1), filter .15s ease, visibility 0s linear 0s;
}
#wordRandom:hover{ background: var(--band); filter: brightness(1.06); }
#wordRandom:active{ transform: translateX(-50%) scale(.95); }
#wordRandom.away{
  opacity: 0; visibility: hidden; pointer-events: none;
  transform: translateX(-50%) translateY(18px) scale(.9);
  transition: opacity .25s ease, transform .25s ease, visibility 0s linear .25s;
}

/* ---------- bedtime: a clock that shows how long until bed ---------- */

#bedtime{
  display: none;
  box-sizing: border-box;
  min-height: 100vh; min-height: 100dvh;
  padding: calc(env(safe-area-inset-top,0px) + 70px) 16px calc(env(safe-area-inset-bottom,0px) + 24px);
  align-items: center; justify-content: center;
}
body.bedtime #bedtime{ display: flex; }
body.bedtime #stage,
body.bedtime #count,
body.bedtime .reading-only{ display: none !important; }

.bt{
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-areas: "bed wake" "dial dial" "left left";
  justify-items: center; align-items: center;
  gap: clamp(10px, 2.4vh, 24px) 16px;
  width: 100%; max-width: 640px;
}
.bt-bed{ grid-area: bed; }
.bt-wake{ grid-area: wake; }
.bt-when{ text-align: center; }
.bt-when .lbl{
  display: inline-flex; align-items: center; gap: 7px;
  font-size: 15px; font-weight: 600; letter-spacing: .03em;
  color: var(--ink-soft);
}
.bt-when .lbl svg{ width: 20px; height: 20px; flex: none; }
.bt-when .time{
  font-size: clamp(34px, 9vw, 54px); font-weight: 300; line-height: 1.1;
  color: var(--ink); font-variant-numeric: tabular-nums; letter-spacing: .01em;
}

#dial{
  grid-area: dial;
  display: block;
  width: max(220px, min(88vw, calc(100vh - 290px), 720px));
  width: max(220px, min(88vw, calc(100dvh - 290px), 720px));
  height: auto; aspect-ratio: 1 / 1;
  overflow: visible;
}
#dial .face{ fill: var(--track); opacity: .45; }
#dial .track{ fill: none; stroke: var(--track); stroke-width: 34; }
/* time left until the next change: light up to bedtime, full colour for the sleep still to come */
#dial .togo{ fill: none; stroke: var(--band); stroke-opacity: .3; stroke-width: 34; }
#dial .togo.night{ stroke-opacity: 1; }
#dial .ticks line{ stroke: var(--ink-soft); stroke-width: 1.4; opacity: .45; stroke-linecap: round; }
#dial .ticks line.h{ stroke-width: 3; opacity: .85; }
#dial .nums text{ fill: var(--ink); font-size: 24px; font-weight: 600; text-anchor: middle; dominant-baseline: central; }
#dial .handle circle{ fill: var(--bg); stroke: var(--band); stroke-width: 3; }
#dial .hand{ fill: var(--ink); stroke: var(--ink); transition: transform 1s linear; }   /* glides on, second by second */
#dial .hand .now{ fill: var(--ink); stroke: var(--bg); stroke-width: 3; }   /* where the hour hand points, on the ring */
#dial .hub{ fill: var(--ink); }
#dial .hub-in{ fill: var(--bg); }

/* the moon and the sun: in the labels and on both ends of the sleep arc */
.bt-moon{ fill: var(--band); }
.bt-sun{ fill: var(--band); stroke: var(--band); stroke-width: 2; stroke-linecap: round; }

.bt-left{ grid-area: left; text-align: center; }
.bt-left .big{ font-size: clamp(26px, 6.4vw, 40px); font-weight: 600; line-height: 1.15; color: var(--ink); }
.bt-left .small{ margin-top: 4px; font-size: 15px; letter-spacing: .02em; color: var(--ink-soft); }

/* landscape phones and short windows: the two times either side of the clock */
@media (orientation: landscape) and (max-height: 640px){
  #bedtime{
    padding-top: calc(env(safe-area-inset-top,0px) + 56px);
    padding-bottom: calc(env(safe-area-inset-bottom,0px) + 10px);
  }
  .bt{
    grid-template-columns: 1fr auto 1fr;
    grid-template-areas: "bed dial wake" "bed left wake";
    max-width: 980px; gap: 4px 24px;
  }
  #dial{
    width: max(200px, calc(100vh - 150px));
    width: max(200px, calc(100dvh - 150px));
  }
}

/* in maths, words and bedtime the settings sheet only carries what they use */
@media (min-width: 720px){
  body.maths #panel,
  body.words #panel,
  body.bedtime #panel{ grid-template-columns: minmax(0,1fr); max-width: 460px; }
}

@media (prefers-reduced-motion: reduce){
  *{ transition-duration:.01ms !important; animation-duration:.01ms !important; }
  .answer.empty::after{ animation: none; }
}

/* ---------- phones and narrow windows ---------- */

@media (max-width: 768px){
  #count{ left: 16px; }
  #editor .acts{ flex-direction: column; }
}

/* four modes and Settings across the top of a phone: a little tighter */
@media (max-width: 430px){
  #topbar{ gap: 6px; }
  #modes button{ padding: 5px 7px; letter-spacing: .02em; }
  #settingsBtn{ padding: 8px 10px 8px 11px; gap: 5px; letter-spacing: .02em; }
}
@media (max-width: 359px){
  #modes button{ padding: 5px 5px; font-size: 10.5px; letter-spacing: 0; }
  #settingsBtn{ font-size: 10.5px; letter-spacing: 0; }
}
</style>

<body>

    <div class="badge" aria-hidden="true">&#x1F44D;<span class="tick">&#x2705;</span></div>
    <h2>Well done Evalyn!</h2>

</div>

<main id="maths" aria-label="Maths">

  <div class="bt">
    <div class="bt-when bt-bed">
      <div class="lbl"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="bt-moon" d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>Bedtime</div>

    </div>
    <div class="bt-when bt-wake">
      <div class="lbl"><svg viewBox="0 0 24 24" aria-hidden="true"><circle class="bt-sun" cx="12" cy="12" r="4.2"/><path class="bt-sun" d="M12 2.5v2.6M12 18.9v2.6M2.5 12h2.6M18.9 12h2.6M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></svg>Wake up</div>
      <div class="time" id="btWakeTime"></div>

      <circle class="face" r="153"/>

      <g class="ticks" id="btTicks"></g>
      <g class="nums" id="btNums"></g>
      <g class="handle" id="btBedHandle"><circle r="20"/><g transform="translate(-11 -11) scale(.9167)"><path class="bt-moon" d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></g></g>
      <g class="handle" id="btWakeHandle"><circle r="20"/><g transform="translate(-11 -11) scale(.9167)"><circle class="bt-sun" cx="12" cy="12" r="4.2"/><path class="bt-sun" d="M12 2.5v2.6M12 18.9v2.6M2.5 12h2.6M18.9 12h2.6M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></g></g>

        <line x1="0" y1="18" x2="0" y2="-124" stroke-width="4" stroke-linecap="round"/>

    <div class="bt-left"><div class="big" id="btBig"></div><div class="small" id="btSmall"></div></div>

<div id="scrim"></div>

<div id="topbar">
  <div id="modes" role="group" aria-label="Mode">

  </button>

<script>
(function(){
"use strict";

var DEFAULT_TEXT =
"Fox had six socks.\n" +
"A big hen got one sock and ran off fast.\n\n" +
"Fox did not mind.\n" +
"Now Fox has five socks and a hen as a pal.";

var BANDS = [
  ["Pink","#F06FA8","#3A0E21"],
  ["Blue","#3D7CC9","#ffffff"],
  ["Turquoise","#2BAFA8","#04302E"]
];

var $ = function(id){ return document.getElementById(id); };
var root = document.documentElement;
var textEl = $("text");
var synth = window.speechSynthesis;

var readBtn = { textContent: "Read" };   /* label sink: the Read button was removed */
var tokens = [], sentences = [];
var current = -1, liveSentence = -1;
var reading = false, paused = false;
var timers = [];
var voice = null, primed = false;

function store(k,v){ try{ localStorage.setItem("evalyn:"+k, v); }catch(e){} }
function recall(k,d){ try{ var v = localStorage.getItem("evalyn:"+k); return v===null?d:v; }catch(e){ return d; } }

/* ---------------- text ---------------- */

function tokenize(text){
  tokens = []; sentences = [];
  textEl.innerHTML = "";

  var paras = text.split(/\n\s*\n/);
  var cursor = 0, sIdx = 0, map = {};

  paras.forEach(function(para){
    var pStart = text.indexOf(para, cursor);
    cursor = pStart + para.length;

    var p = document.createElement("p");
    var re = /\S+/g, m, lastEnd = pStart;

    while ((m = re.exec(para)) !== null){
      var start = pStart + m.index, end = start + m[0].length;
      if (start > lastEnd) p.appendChild(document.createTextNode(text.slice(lastEnd, start)));
      lastEnd = end;

      var span = document.createElement("span");
      span.className = "w";
      span.textContent = m[0];
      span.dataset.i = tokens.length;
      span.setAttribute("tabindex","0");
      p.appendChild(span);

      if (!map[sIdx]) map[sIdx] = { start:start, end:end, tokens:[] };
      map[sIdx].end = end;
      map[sIdx].tokens.push(tokens.length);
      tokens.push({ word:m[0], start:start, end:end, sentence:0, el:span });

      if (/[.!?\u2026]["'\u201d\u2019)\]]?$/.test(m[0])) sIdx++;
    }
    textEl.appendChild(p);
    sIdx++;
  });

  Object.keys(map).sort(function(a,b){ return a-b; }).forEach(function(k){
    var s = map[k];
    s.text = text.slice(s.start, s.end);
    s.index = sentences.length;
    s.tokens.forEach(function(ti){
      tokens[ti].sentence = sentences.length;
      tokens[ti].el.dataset.s = sentences.length;
    });
    sentences.push(s);
  });

  current = -1; liveSentence = -1;
  setLive(-1);
  showDone(false);
  updateCount();
}

/* the well done under the story, shown once she reaches the last sentence */
function showDone(on){ $("done").classList.toggle("show", !!on); }

function updateCount(){
  var n = tokens.length;
  $("count").textContent = (reading && current > -1)
    ? (current + 1) + " / " + n
    : n + (n === 1 ? " word" : " words");
}

/* ---------------- highlight and dim ---------------- */

function setLive(si){
  if (si === liveSentence) return;
  liveSentence = si;
  if (si < 0){
    textEl.classList.remove("dim");
    tokens.forEach(function(t){ t.el.classList.remove("live"); });
    return;
  }
  tokens.forEach(function(t){ t.el.classList.toggle("live", t.sentence === si); });
  textEl.classList.add("dim");
  if (si === sentences.length - 1) showDone(true);
}

var smooth = !window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/* Auto-scroll is for touch devices only — iPad Air and phones. On the Mac
   and the TV the page stays where it is and the mouse does the scrolling. */
var touchScreen = window.matchMedia("(pointer: coarse), (max-width: 1180px)");

/* The sentence being read rises to a quarter of the way down the screen
   (three quarters of the way up), so most of the screen shows what comes
   next. A later sentence scrolls down, an earlier one scrolls back up. */
var READ_LINE = 0.25;

function topClear(){ return $("topbar").getBoundingClientRect().bottom + 16; }

/* where a block of this height should sit: centred on the reading line,
   but never tucked under the top bar (so a long sentence starts just below it) */
function raisedTop(height){ return Math.max(topClear(), window.innerHeight * READ_LINE - height / 2); }

function scrollToY(target){
  var max = Math.max(0, document.documentElement.scrollHeight - window.innerHeight);
  target = Math.max(0, Math.min(target, max));
  if (Math.abs(target - window.pageYOffset) < 8) return;
  try{ window.scrollTo({ top: target, behavior: smooth ? "smooth" : "auto" }); }
  catch(e){ window.scrollTo(0, target); }
}

function raiseSentence(si){
  if (!touchScreen.matches) return;
  var s = sentences[si];
  if (!s || !s.tokens.length) return;
  var first = tokens[s.tokens[0]].el.getBoundingClientRect();
  var last  = tokens[s.tokens[s.tokens.length - 1]].el.getBoundingClientRect();
  scrollToY(window.pageYOffset + first.top - raisedTop(last.bottom - first.top));
}

function clearWord(){
  if (current > -1 && tokens[current]) tokens[current].el.classList.remove("on");
  current = -1;
}

function markWord(i){
  if (i === current) return;
  clearWord();
  if (!tokens[i]) return;
  current = i;
  tokens[i].el.classList.add("on");
  setLive(tokens[i].sentence);
  updateCount();
  if (reading){   /* reading aloud: when the word nears an edge, lift its line up to the reading line */
    var r = tokens[i].el.getBoundingClientRect();
    if (r.top < topClear() || r.bottom > window.innerHeight - 60){
      scrollToY(window.pageYOffset + r.top - raisedTop(r.height));
    }
  }
}

/* ---------------- speech: Daniel, en-GB ---------------- */

function pickVoice(){
  if (!synth) return;
  var all = synth.getVoices();
  voice =
    all.find(function(v){ return /daniel/i.test(v.name) && /en[-_]GB/i.test(v.lang); }) ||
    all.find(function(v){ return /daniel/i.test(v.name); }) ||
    all.find(function(v){ return /en[-_]GB/i.test(v.lang); }) ||
    all.find(function(v){ return /^en/i.test(v.lang); }) || null;
}

/* iOS refuses to speak unless the first utterance follows a real tap */
function prime(){
  if (primed || !synth) return;
  primed = true;
  try{
    var u = new SpeechSynthesisUtterance(" ");
    u.volume = 0;
    synth.speak(u);
  }catch(e){}
}
document.addEventListener("pointerdown", prime, { once: true });
document.addEventListener("touchstart", prime, { once: true, passive: true });

function rate(){ return parseFloat($("rate").value); }

function stopAll(){
  timers.forEach(clearTimeout); timers = [];
  if (synth) synth.cancel();
  reading = false; paused = false;
  readBtn.textContent = "Read";
  updateCount();
}

function utter(text){
  var u = new SpeechSynthesisUtterance(text);
  if (voice) u.voice = voice;
  u.lang = voice ? voice.lang : "en-GB";
  u.rate = rate();
  return u;
}

function speakSentence(si, chain){
  if (!synth || si >= sentences.length){ stopAll(); clearWord(); setLive(-1); return; }
  var s = sentences[si];
  setLive(si);
  raiseSentence(si);

  var u = utter(s.text), got = false;

  u.onboundary = function(e){
    if (e.name && e.name !== "word") return;
    got = true;
    var abs = s.start + (e.charIndex || 0);
    var idx = s.tokens.find(function(ti){ return tokens[ti].start <= abs && abs < tokens[ti].end; });
    if (idx === undefined) idx = s.tokens.find(function(ti){ return tokens[ti].start >= abs; });
    if (idx !== undefined) markWord(idx);
  };
  u.onstart = function(){
    setTimeout(function(){ if (!got && reading) fallback(s); }, 500);
  };
  u.onend = function(){
    if (!reading) return;
    timers.forEach(clearTimeout); timers = [];
    if (chain) speakSentence(si + 1, true);
    else { stopAll(); clearWord(); }
  };
  u.onerror = function(){ stopAll(); };

  synth.speak(u);
}

/* most iOS voices skip boundary events, so estimate word timings instead */
function fallback(s){
  var total = (s.text.length / (13.5 * rate())) * 1000;
  var w = s.tokens.map(function(ti){ return tokens[ti].word.length + 1; });
  var sum = w.reduce(function(a,b){ return a+b; }, 0), t = 0;
  s.tokens.forEach(function(ti, n){
    timers.push(setTimeout(function(){ if (reading) markWord(ti); }, t));
    t += (w[n] / sum) * total;
  });
}

function play(){
  if (!synth) return;
  if (reading && !paused){ synth.pause(); paused = true; readBtn.textContent = "Resume"; return; }
  if (reading && paused){ synth.resume(); paused = false; readBtn.textContent = "Pause"; return; }
  reading = true; paused = false;
  readBtn.textContent = "Pause";
  setSheet(false);
  speakSentence(current > -1 ? tokens[current].sentence : 0, true);
}

function speakWord(word){
  if (!synth || !word) return;
  synth.cancel();
  timers.forEach(clearTimeout); timers = [];
  reading = false; paused = false;
  readBtn.textContent = "Read";
  var u = utter(word);
  u.rate = Math.max(.35, rate() * .72);
  synth.speak(u);
}

function readSentence(si){
  if (synth) synth.cancel();
  timers.forEach(clearTimeout); timers = [];
  reading = true; paused = false;
  readBtn.textContent = "Pause";
  speakSentence(si, false);
}

/* ---------------- interaction ---------------- */

var pending = null, lastI = -1, lastTap = 0, hoverClear = null;
var pointerType = "mouse";

/* tracked per event rather than per device, so an iPad with a keyboard and
   trackpad still gets the mouse behaviour when a mouse is what's being used */
document.addEventListener("pointerdown", function(e){
  pointerType = e.pointerType || "mouse";
}, true);

function isTouch(){ return pointerType === "touch" || pointerType === "pen"; }

function clean(w){ return w.replace(/[^\w'\u2019-]/g, ""); }

textEl.addEventListener("click", function(e){
  var el = e.target.closest(".w");
  if (!el) return;
  var i = parseInt(el.dataset.i, 10);
  var si = parseInt(el.dataset.s, 10);
  var now = Date.now();

  /* Touch: silent. One tap isolates the sentence, two taps highlight the word.
     No delay on the first tap, because neither action needs undoing. */
  if (isTouch()){
    clearTimeout(hoverClear);
    if (i === lastI && now - lastTap < 600){   /* forgiving window — a 5-year-old double-taps slowly */
      lastI = -1; lastTap = 0;
      markWord(i);
    } else {
      lastI = i; lastTap = now;
      clearWord();
      setLive(si);
      updateCount();
    }
    raiseSentence(si);
    return;
  }

  /* Mouse: one click speaks the word, two read the sentence. Double-click is
     detected here rather than via dblclick, which Safari fires unreliably. */
  if (i === lastI && now - lastTap < 330){
    clearTimeout(pending); pending = null;
    lastI = -1; lastTap = 0;
    markWord(i);
    readSentence(si);
    return;
  }

  lastI = i; lastTap = now;
  clearTimeout(hoverClear);
  setLive(si);
  raiseSentence(si);

  clearTimeout(pending);
  pending = setTimeout(function(){
    pending = null;
    markWord(i);
    speakWord(clean(tokens[i].word));
  }, 260);
});

/* tapping the empty space around the text puts everything back */
$("stage").addEventListener("click", function(e){
  if (e.target.closest(".w") || reading) return;
  clearTimeout(pending); pending = null;
  lastI = -1; lastTap = 0;
  clearWord(); setLive(-1); updateCount();
});

textEl.addEventListener("mouseover", function(e){
  var el = e.target.closest(".w");
  if (!el || reading) return;
  clearTimeout(hoverClear);
  setLive(parseInt(el.dataset.s, 10));
});

textEl.addEventListener("mouseleave", function(){
  if (reading) return;
  hoverClear = setTimeout(function(){
    if (!reading){ clearWord(); setLive(-1); updateCount(); }
  }, 500);
});

textEl.addEventListener("touchstart", function(e){
  var el = e.target.closest(".w");
  if (!el) return;
  clearTimeout(hoverClear);
  setLive(parseInt(el.dataset.s, 10));
}, { passive: true });

textEl.addEventListener("keydown", function(e){
  var el = e.target.closest(".w");
  if (!el) return;
  if (e.key === "Enter" || e.key === " "){
    e.preventDefault();
    var i = parseInt(el.dataset.i, 10);
    markWord(i);
    speakWord(clean(tokens[i].word));
  }
});

/* like an iOS sheet: tap the grabber to close it, or drag it up and let go */
(function(){
  var sheet = $("sheet"), grab = $("grabber");
  var startY = 0, dy = 0, t0 = 0, dragging = false, moved = false;

  grab.addEventListener("touchstart", function(e){
    if (!sheetOpen()) return;
    dragging = true; moved = false; dy = 0;
    startY = e.touches[0].clientY; t0 = Date.now();
    sheet.classList.add("dragging");
  }, { passive: true });

  grab.addEventListener("touchmove", function(e){
    if (!dragging) return;
    e.preventDefault();
    dy = Math.min(0, e.touches[0].clientY - startY);   /* upwards only */
    if (dy < -6) moved = true;
    sheet.style.transform = "translateY(" + dy + "px)";
  }, { passive: false });

  function release(){
    if (!dragging) return;
    dragging = false;
    sheet.classList.remove("dragging");
    sheet.style.transform = "";
    var speed = -dy / Math.max(1, Date.now() - t0);   /* px per ms */
    if (-dy > Math.min(120, sheet.offsetHeight * 0.25) || (moved && speed > 0.6)) setSheet(false);
    setTimeout(function(){ moved = false; }, 400);
  }
  grab.addEventListener("touchend", release);
  grab.addEventListener("touchcancel", release);

  grab.addEventListener("click", function(){
    if (moved) return;   /* the end of a drag, not a tap */
    setSheet(false);
  });
})();

/* ---------------- maths ---------------- */

var YES_EMOJI = ["\u{1F389}","\u{1F31F}","\u{1F973}","\u{1F44F}","\u{1F984}","\u{1F680}","\u{1F3C6}","\u{1F308}"];
var YES_MSG   = ["Yes! You got it!", "Well done!", "Spot on!", "You worked it out!", "Brilliant!"];
var NO_EMOJI  = ["\u{1F914}"];   /* wrong answers: always the thinking face, so it reads clearly */
var NO_MSG    = ["Not quite. Have another go!", "Oops! Try again!", "Hmm, let's check again!"];

var M = { nums: [], ops: [], total: 0, hide: -1, answer: 0, typed: "", tries: 0, locked: false, last: "", timer: null };

function rnd(a, b){ return a + Math.floor(Math.random() * (b - a + 1)); }
function pick(list){ return list[Math.floor(Math.random() * list.length)]; }

/* Five levels, set by the Complexity slider in Settings. Level 3 is the
   original mix. Higher levels use bigger numbers (9 − 7, 10 − 5) and longer
   chains (10 − 1 − 1). Nothing ever goes below zero, not even halfway through.
     mix   chance of 2, 3 or 4 numbers
     plus  ranges for a + b, and the largest answer allowed
     minus ranges for a − b (b is never bigger than a)
     m3/m4 first number and step size for 3- and 4-number chains, kept within mMax */
var LEVELS = {
  1: { name: "Up to 5",        mix: [0.9, 0.1, 0],
       plus: { a: [0, 5],  b: [0, 5],  max: 10 }, minus: { a: [0, 5],   b: [0, 5] },
       m3: { first: [0, 3],   step: [0, 2] }, m4: { first: [0, 2],   step: [0, 1] }, mMax: 6 },
  2: { name: "Within 10",      mix: [0.8, 0.15, 0.05],
       plus: { a: [0, 10], b: [0, 10], max: 10 }, minus: { a: [0, 10],  b: [0, 10] },
       m3: { first: [0, 5],   step: [0, 3] }, m4: { first: [0, 3],   step: [0, 2] }, mMax: 10 },
  3: { name: "Within 20",      mix: [0.8, 0.15, 0.05],
       plus: { a: [0, 10], b: [0, 10], max: 20 }, minus: { a: [0, 10],  b: [0, 10] },
       m3: { first: [0, 5],   step: [0, 5] }, m4: { first: [0, 3],   step: [0, 3] }, mMax: 10 },
  4: { name: "Bigger numbers", mix: [0.7, 0.2, 0.1],
       plus: { a: [3, 10], b: [3, 10], max: 20 }, minus: { a: [5, 10],  b: [3, 10] },
       m3: { first: [6, 10],  step: [1, 3] }, m4: { first: [6, 10],  step: [1, 2] }, mMax: 10 },
  5: { name: "Teens",          mix: [0.7, 0.2, 0.1],
       plus: { a: [6, 18], b: [2, 10], max: 20 }, minus: { a: [11, 20], b: [2, 13] },
       m3: { first: [10, 20], step: [1, 5] }, m4: { first: [10, 20], step: [1, 4] }, mMax: 20 }
};

function level(){ return LEVELS[parseInt($("level").value, 10)] || LEVELS[3]; }

function makeSum(){
  var L = level(), r = Math.random();
  var count = r < L.mix[0] ? 2 : (r < L.mix[0] + L.mix[1] ? 3 : 4);
  var nums = [], ops = [], total, a, b;

  if (count === 2){
    if (Math.random() < 0.55){
      a = rnd(L.plus.a[0], Math.min(L.plus.a[1], L.plus.max - L.plus.b[0]));
      b = rnd(L.plus.b[0], Math.min(L.plus.b[1], L.plus.max - a));
      ops.push("+"); total = a + b;
    } else {
      a = rnd(L.minus.a[0], L.minus.a[1]);
      b = rnd(L.minus.b[0], Math.min(L.minus.b[1], a));
      ops.push("\u2212"); total = a - b;
    }
    nums.push(a, b);
  } else {
    var m = count === 3 ? L.m3 : L.m4;
    total = rnd(m.first[0], Math.min(m.first[1], L.mMax));
    nums.push(total);
    for (var k = 1; k < count; k++){
      var canPlus = m.step[0] <= L.mMax - total, canMinus = m.step[0] <= total;
      var plus = canPlus && (!canMinus || total === 0 || Math.random() < 0.6);
      var n = plus ? rnd(m.step[0], Math.min(m.step[1], L.mMax - total))
                   : rnd(m.step[0], Math.min(m.step[1], total));
      ops.push(plus ? "+" : "\u2212");
      nums.push(n);
      total += plus ? n : -n;
    }
  }
  return { nums: nums, ops: ops, answer: total };
}

function answerBox(){ return $("sum").querySelector(".answer"); }

function renderTyped(){
  var box = answerBox();
  box.textContent = M.typed;
  box.classList.toggle("empty", M.typed === "");
}

/* builds "3 + 4 = [ ]", or "3 + [ ] = 7" when a number is hidden,
   and sizes it so even four numbers fit on a phone */
function renderSum(){
  var el = $("sum"), ems = 0, parts = 0;
  el.innerHTML = "";
  function add(cls, text, width){
    var s = document.createElement("span");
    s.className = cls;
    s.textContent = text;
    el.appendChild(s);
    ems += width; parts++;
  }
  M.nums.forEach(function(n, i){
    if (i) add("op", M.ops[i - 1], 0.62);
    if (i === M.hide) add("answer", "", 1.75);
    else add("num", String(n), 0.58 * String(n).length);
  });
  add("op", "=", 0.62);
  if (M.hide >= 0) add("num", String(M.total), 0.58 * String(M.total).length);
  else add("answer", "", 1.75);
  ems += 0.32 * (parts - 1);
  el.style.setProperty("--ems", (ems * 1.06).toFixed(2));
  renderTyped();
}

function setFeedback(emoji, msg, grow){
  var f = $("feedback"), e = f.querySelector(".emoji");
  f.classList.remove("pop");
  void f.offsetWidth;   /* restart the pop animation */
  e.textContent = emoji;
  e.style.setProperty("--grow", grow || 1);
  f.querySelector(".msg").textContent = msg;
  if (emoji) f.classList.add("pop");
}

/* About 3 in 10 two-number sums hide one of the numbers instead of the
   answer (7 + ? = 10, ? − 3 = 4): the part–whole problems Year 1 practises.
   M.answer is always the number she has to type; M.total is the result. */
function newSum(){
  clearTimeout(M.timer);
  var s, hide, key, guard = 0;
  do {
    s = makeSum();
    hide = (s.nums.length === 2 && Math.random() < 0.3) ? rnd(0, 1) : -1;
    key = s.nums.join(",") + s.ops.join("") + hide;
  } while (key === M.last && ++guard < 20);
  M.last = key;
  M.nums = s.nums; M.ops = s.ops; M.total = s.answer; M.hide = hide;
  M.answer = hide >= 0 ? s.nums[hide] : s.answer;
  M.typed = ""; M.tries = 0; M.locked = false;
  setFeedback("", "");
  renderSum();
}

function typeDigit(d){
  if (M.locked) return;
  if (M.typed === "0") M.typed = "";
  if (M.typed.length >= 2) return;
  M.typed += d;
  renderTyped();
}

function deleteDigit(){
  if (M.locked) return;
  M.typed = M.typed.slice(0, -1);
  renderTyped();
}

function checkAnswer(){
  if (M.locked || M.typed === "") return;
  var box = answerBox();
  M.locked = true;

  if (parseInt(M.typed, 10) === M.answer){
    box.classList.add("right");
    setFeedback(pick(YES_EMOJI), pick(YES_MSG));
    M.timer = setTimeout(newSum, 2200);
    return;
  }

  M.tries++;
  box.classList.remove("shake");
  void box.offsetWidth;
  box.classList.add("shake");

  /* as many goes as she needs, same sum, answer never shown.
     The thinking face grows a little with each try (capped) so every
     new attempt visibly registers. */
  setFeedback(NO_EMOJI[0], pick(NO_MSG), Math.min(1 + 0.12 * (M.tries - 1), 1.5));
  M.timer = setTimeout(function(){ M.typed = ""; renderTyped(); M.locked = false; }, 700);
}

$("pad").addEventListener("click", function(e){
  var b = e.target.closest("button");
  if (!b) return;
  var k = b.dataset.k;
  if (k === "del") deleteDigit();
  else if (k === "ok") checkAnswer();
  else typeDigit(k);
});

(function(){
  var el = $("level"), saved = parseInt(recall("level", "3"), 10);
  if (saved >= 1 && saved <= 5) el.value = saved;

    return i;
  }

  function hideButton(){
    away = true;
    btn.classList.add("away");
    btn.setAttribute("aria-hidden", "true");
    btn.tabIndex = -1;
  }
  function showButton(){
    away = false;
    btn.classList.remove("away");
    btn.removeAttribute("aria-hidden");
    btn.tabIndex = 0;
  }

  /* Spin the globe a turn or two about the vertical and settle with the
     word facing you, then tip it level into the middle. */
  function startSpin(i){
    var p = i * 3, m = Rm;
    var qx = m[0]*P[p] + m[1]*P[p+1] + m[2]*P[p+2];
    var qy = m[3]*P[p] + m[4]*P[p+1] + m[5]*P[p+2];
    var qz = m[6]*P[p] + m[7]*P[p+1] + m[8]*P[p+2];
    var phi = Math.atan2(-qx, qz);                          /* the turn that faces it to you */
    var tilt = Math.atan2(qy, Math.sqrt(qx * qx + qz * qz)); /* the tip that centres it */
    var dur = reduce ? 900 : 2200 + Math.random() * 1600;   /* 2.2 to 3.8 seconds */
    var theta = phi;
    if (!reduce){
      var dir = Math.random() < 0.5 ? -1 : 1;
      var want = dir * TAU * Math.max(1.3, 1.6 * dur / 1000 / 2.46);   /* peaks near 1.6 turns a second */
      theta = phi + TAU * Math.round((want - phi) / TAU);
      if (dir * theta < TAU * 1.2) theta += dir * TAU;
    }
    spin = { t0: performance.now(), dur: dur, R: Rm.slice(), theta: theta, tilt: tilt, target: i };
  }

  function land(){
    var i = spin.target;
    spin = null;
    tidy();
    omega = [0, 0, 0];
    lastInput = performance.now();
    hi = i; hiUntil = lastInput + 1e7;
    clearTimeout(landTimer); clearTimeout(awayTimer);
    landTimer = setTimeout(function(){ if (active) openCard(i, X[i], Y[i], FS[i] * 1.15); }, 220);
    awayTimer = setTimeout(showButton, 220 + 2500);   /* back a few seconds after the word appears */
  }

  function random(){
    if (!active || !N || spin || away || sheetOpen()) return;
    closeCard();
    hideButton();
    hi = -1;
    drag = null; pinch = null; ptrs = {}; nPtr = 0;
    canvas.classList.remove("grabbing");
    startSpin(nextWord());
    request();
  }
  btn.addEventListener("click", random);

  /* ---- touch, mouse, trackpad ---- */

  function fingers(){ return Object.keys(ptrs).map(function(k){ return ptrs[k]; }); }
  function apart(a, b){ return Math.hypot(a.x - b.x, a.y - b.y) || 1; }

  canvas.addEventListener("pointerdown", function(e){
    if (spin || (e.pointerType === "mouse" && e.button !== 0)) return;
    try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
    if (!ptrs[e.pointerId]) nPtr++;
    ptrs[e.pointerId] = { x: e.clientX, y: e.clientY };
    lastInput = performance.now();
    omega = [0, 0, 0];               /* a finger on the globe holds it still */
    if (nPtr === 1){
      drag = { id: e.pointerId, x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY, t: lastInput, tap: true };
      samples = [];
      canvas.classList.add("grabbing");
    } else if (nPtr === 2){
      var f = fingers();
      pinch = { d: apart(f[0], f[1]), z: zoom };
      drag = null;
    }
    request();
  });

  canvas.addEventListener("pointermove", function(e){
    var p = ptrs[e.pointerId];
    if (!p) return;
    p.x = e.clientX; p.y = e.clientY;
    lastInput = performance.now();
    if (pinch){
      var f = fingers();
      if (f.length >= 2){ zoom = clamp(pinch.z * apart(f[0], f[1]) / pinch.d, ZMIN, ZMAX); request(); }
      return;
    }
    if (!drag || drag.id !== e.pointerId) return;
    var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    drag.x = e.clientX; drag.y = e.clientY;
    if (drag.tap && Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 8) drag.tap = false;
    if (drag.tap) return;
    var k = 1 / (R0 * zoom * D / (D - 1));   /* the front of the globe follows the finger */
    turn(dy * k, dx * k, 0);
    samples.push({ t: lastInput, x: dy * k, y: dx * k });
    if (samples.length > 10) samples.shift();
    request();
  });

  function up(e){
    if (!ptrs[e.pointerId]) return;
    delete ptrs[e.pointerId];
    nPtr = Math.max(0, nPtr - 1);
    var now = performance.now();
    lastInput = now;
    if (pinch){
      if (nPtr < 2) pinch = null;
      if (nPtr === 1){   /* one finger left: carry on turning from where it is */
        var id = Object.keys(ptrs)[0], p = ptrs[id];
        drag = { id: +id, x: p.x, y: p.y, sx: p.x, sy: p.y, t: now, tap: false };
        samples = [];
      }
      return;
    }
    if (!drag || drag.id !== e.pointerId) return;
    var d = drag;
    drag = null;
    canvas.classList.remove("grabbing");
    if (d.tap){
      if (e.type === "pointerup" && now - d.t < 600) tapAt(e.clientX, e.clientY);
      return;
    }
    /* a flick keeps it spinning, slowing gently */
    var rx = 0, ry = 0, first = now;
    for (var i = samples.length - 1; i >= 0 && now - samples[i].t < 100; i--){
      rx += samples[i].x; ry += samples[i].y; first = samples[i].t;
    }
    var span = (now - first + 16) / 1000, w = Math.hypot(rx, ry) / span;
    var cut = w > 14 ? 14 / w : 1;
    omega = [rx / span * cut, ry / span * cut, 0];
    request();
  }
  canvas.addEventListener("pointerup", up);
  canvas.addEventListener("pointercancel", up);
  canvas.addEventListener("lostpointercapture", up);

  /* a tap picks the clear word under the finger, or the nearest one */
  function tapAt(x, y){
    var best = -1, bz = -2, near = -1, nd = 46 * 46;
    for (var k = 0; k < placed.length; k++){
      var i = placed[k], dx = x - X[i], dy = y - Y[i];
      if (Math.abs(dx) <= EM[i] * FS[i] * 0.5 + 6 && Math.abs(dy) <= FS[i] * 0.6 + 6){
        if (Z[i] > bz){ bz = Z[i]; best = i; }
      } else if (dx * dx + dy * dy < nd){ nd = dx * dx + dy * dy; near = i; }
    }
    var chosen = best >= 0 ? best : near;
    if (chosen < 0) return;
    hi = chosen;
    request();
    openCard(chosen, X[chosen], Y[chosen], FS[chosen]);
  }

  canvas.addEventListener("wheel", function(e){
    e.preventDefault();
    if (spin) return;
    var d = e.deltaY * (e.deltaMode === 1 ? 16 : (e.deltaMode === 2 ? 400 : 1));
    zoom = clamp(zoom * Math.exp(-d * (e.ctrlKey ? 0.01 : 0.002)), ZMIN, ZMAX);
    lastInput = performance.now();
    request();
  }, { passive: false });

  /* Safari: trackpad pinch on the Mac, and no page zoom on the iPad */
  ["gesturestart", "gesturechange", "gestureend"].forEach(function(type){
    $("words").addEventListener(type, function(e){
      e.preventDefault();
      if (type === "gesturestart"){ gest = zoom; return; }
      if (type === "gestureend"){ gest = null; return; }
      if (gest === null || pinch || spin) return;   /* touch screens pinch with pointer events */
      zoom = clamp(gest * e.scale, ZMIN, ZMAX);
      lastInput = performance.now();
      request();
    });
  });

  window.addEventListener("resize", function(){ if (active){ resize(); request(); } });

  /* keyboard, for the Mac and the TV */
  function nudge(key){
    if (spin) return;
    var v = 0.9;
    if (key === "ArrowLeft") omega[1] -= v;
    else if (key === "ArrowRight") omega[1] += v;
    else if (key === "ArrowUp") omega[0] -= v;
    else if (key === "ArrowDown") omega[0] += v;
    lastInput = performance.now();
    request();
  }
  function zoomBy(f){
    if (spin) return;
    zoom = clamp(zoom * f, ZMIN, ZMAX);
    lastInput = performance.now();
    request();
  }

  function activate(on){
    if (on){
      if (!ready) init();
      var was = active;
      active = true;
      resize();
      colours();
      if (!was && !reduce){ intro = { t0: performance.now() }; omega = [0, -2.4, 0]; }   /* whoosh in */
      request();
      return;
    }
    if (!active) return;
    active = false;
    if (raf){ cancelAnimationFrame(raf); raf = 0; }
    lastT = 0;
    if (spin){
      Rm = mul(rot(1, 0, 0, spin.tilt), mul(rot(0, 1, 0, spin.theta), spin.R));
      spin = null;
    }
    clearTimeout(landTimer); clearTimeout(awayTimer);
    cardOpen = false;
    card.classList.remove("show");
    showButton();
    hi = -1;
    drag = null; pinch = null; ptrs = {}; nPtr = 0;
    canvas.classList.remove("grabbing");
  }

  return {
    activate: activate, random: random, nudge: nudge, zoomBy: zoomBy, closeCard: closeCard,
    cardOpen: function(){ return cardOpen; }
  };
})();

/* ---------------- bedtime: a clock that shows how long until bed ---------------- */

/* Sleep runs from BEDTIME to WAKE_UP: change these two to move either. */
var BEDTIME = "19:30", WAKE_UP = "07:30";

var Bedtime = (function(){
  var NS = "http://www.w3.org/2000/svg", DAY = 1440, HALF = 720, RING = 170;
  var BED = mins(BEDTIME), WAKE = mins(WAKE_UP);
  var active = false, built = false, timer = 0, settle = 0;
  var base = 0, minDeg = 0, shown = "";

  function mins(s){ var p = s.split(":"); return (+p[0] * 60 + +p[1]) % DAY; }
  /* a 12-hour face: 12 at the top, turning clockwise */
  function at(m, r){ var a = (m % HALF) / HALF * 2 * Math.PI; return [r * Math.sin(a), -r * Math.cos(a)]; }
  function f(n){ return n.toFixed(2); }
  function arc(from, span, r){   /* clockwise from a time, lasting span minutes: one full lap at most */
    var a = at(from, r);
    if (span >= HALF - 0.05){
      var h = at(from + HALF / 2, r);
      return "M" + f(a[0]) + " " + f(a[1]) + "A" + r + " " + r + " 0 0 1 " + f(h[0]) + " " + f(h[1]) +
             "A" + r + " " + r + " 0 0 1 " + f(a[0]) + " " + f(a[1]);
    }
    var b = at(from + span, r);
    return "M" + f(a[0]) + " " + f(a[1]) + "A" + r + " " + r + " 0 " + (span > HALF / 2 ? 1 : 0) + " 1 " + f(b[0]) + " " + f(b[1]);
  }
  function hhmm(m){ var h = Math.floor(m / 60), mm = m % 60; return (h < 10 ? "0" : "") + h + ":" + (mm < 10 ? "0" : "") + mm; }
  function howLong(m){
    var h = Math.floor(m / 60), mm = m % 60;
    return h && mm ? h + " h " + mm + " min" : (h ? h + " h" : mm + " min");
  }
  function asleep(m){ return BED > WAKE ? (m >= BED || m < WAKE) : (m >= BED && m < WAKE); }
  function make(tag, attrs, parent){
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    parent.appendChild(e);
    return e;
  }

  function build(){
    for (var t = 0; t < 60; t++){                    /* a tick for every minute, longer every five */
      var five = t % 5 === 0, a = at(t * 12, 148), b = at(t * 12, five ? 133 : 141);
      make("line", { x1: f(a[0]), y1: f(a[1]), x2: f(b[0]), y2: f(b[1]), "class": five ? "h" : "" }, $("btTicks"));
    }
    for (var h = 1; h <= 12; h++){
      var p = at(h * 60, 100);   /* inside the minute hand's arrowhead, outside the hour hand's */
      make("text", { x: f(p[0]), y: f(p[1]) }, $("btNums")).textContent = h;
    }
    var s = at(BED, RING), e = at(WAKE, RING);
    $("btBedHandle").setAttribute("transform", "translate(" + f(s[0]) + " " + f(s[1]) + ")");
    $("btWakeHandle").setAttribute("transform", "translate(" + f(e[0]) + " " + f(e[1]) + ")");
    $("btBedTime").textContent = hhmm(BED);
    $("btWakeTime").textContent = hhmm(WAKE);
    built = true;
  }

  /* minutes since 1970 on the local clock: always growing, so the hands only ever go forwards */
  function clock(d){ return d.getTime() / 60000 - d.getTimezoneOffset(); }

  /* the hour hand turns half a degree a minute, the minute hand six */
  function hands(d, sweep){
    var t = clock(d) - base, h = t * 0.5, m = t * 6, hEl = $("btHour"), mEl = $("btMin");
    var jump = !sweep && Math.abs(m - minDeg) > 90;   /* back from another tab or app: no long spin */
    if (jump) hEl.style.transition = mEl.style.transition = "none";
    minDeg = m;
    hEl.style.transform = "rotate(" + h.toFixed(3) + "deg)";
    mEl.style.transform = "rotate(" + m.toFixed(3) + "deg)";
    if (jump){ void hEl.getBoundingClientRect(); hEl.style.transition = mEl.style.transition = ""; }
  }

  function tick(sweep){
    var d = new Date();
    hands(d, sweep === true);

    /* how long until the next change, also as a stretch of the ring from the hour hand to it:
       light up to bedtime, full colour for the sleep still to come before wake-up */
    var now = d.getHours() * 60 + d.getMinutes(), exact = now + d.getSeconds() / 60 + d.getMilliseconds() / 60000;
    var night = asleep(now), next = night ? WAKE : BED;
    var left = ((next - now) % DAY + DAY) % DAY, togo = $("btTogo");
    togo.setAttribute("d", arc(exact, Math.min(HALF, ((next - exact) % DAY + DAY) % DAY), RING));
    togo.classList.toggle("night", night);
    $("btBedHandle").style.display = night ? "none" : "";
    $("btWakeHandle").style.display = night ? "" : "none";
    var big = night ? "Sleep time 🌙" : howLong(left);
    var small = (night ? howLong(left) + " until wake-up" : "until bedtime") + " · now " + hhmm(now);
    if (big + small !== shown){ shown = big + small; $("btBig").textContent = big; $("btSmall").textContent = small; }
  }

  function activate(on){
    if (on === active){ if (on) tick(); return; }
    active = on;
    clearInterval(timer); clearTimeout(settle); timer = 0;
    if (!on) return;
    if (!built) build();
    var t = clock(new Date()), hEl = $("btHour"), mEl = $("btMin");
    base = Math.floor(t / HALF) * HALF;                    /* the last 12 o'clock */
    minDeg = Math.floor((t - base) * 6 / 360) * 360;       /* both hands start at 12 ... */
    hEl.style.transition = mEl.style.transition = "none";
    hEl.style.transform = "rotate(0deg)";
    mEl.style.transform = "rotate(" + minDeg + "deg)";
    void hEl.getBoundingClientRect();
    if (smooth){                                            /* ... and sweep round to the time now */
      hEl.style.transition = mEl.style.transition = "transform 1.1s cubic-bezier(.2,.8,.2,1)";
      settle = setTimeout(function(){ hEl.style.transition = mEl.style.transition = ""; }, 1150);
    } else hEl.style.transition = mEl.style.transition = "";
    shown = "";
    tick(true);
    timer = setInterval(tick, 1000);
  }

  document.addEventListener("visibilitychange", function(){ if (active && !document.hidden) tick(); });

  return { activate: activate };
})();

/* ---------------- Reading | Maths | Words | Bedtime ---------------- */

var mode = "reading";

function setMode(m){
  mode = (m === "maths" || m === "words" || m === "bedtime") ? m : "reading";
  document.body.classList.toggle("maths", mode === "maths");
  document.body.classList.toggle("words", mode === "words");
  document.body.classList.toggle("bedtime", mode === "bedtime");
  $("modeReading").setAttribute("aria-pressed", mode === "reading" ? "true" : "false");
  $("modeMaths").setAttribute("aria-pressed", mode === "maths" ? "true" : "false");
  $("modeWords").setAttribute("aria-pressed", mode === "words" ? "true" : "false");
  $("modeBedtime").setAttribute("aria-pressed", mode === "bedtime" ? "true" : "false");
  stopAll(); clearWord(); setLive(-1);
  setSheet(false);
  if (mode === "maths" && !M.nums.length) newSum();
  Words.activate(mode === "words");
  Bedtime.activate(mode === "bedtime");
  window.scrollTo(0, 0);
  store("mode", mode);
}
$("modeReading").addEventListener("click", function(){ setMode("reading"); });
$("modeMaths").addEventListener("click", function(){ setMode("maths"); });
$("modeWords").addEventListener("click", function(){ setMode("words"); });
$("modeBedtime").addEventListener("click", function(){ setMode("bedtime"); });

/* editor */
$("edit").addEventListener("click", function(){
  stopAll(); clearWord(); setLive(-1);
  $("src").value = recall("text", DEFAULT_TEXT);
  $("editor").classList.add("open");
  document.body.classList.add("locked");
});
$("back").addEventListener("click", function(){
  $("editor").classList.remove("open");
  document.body.classList.remove("locked");
});

$("clear").addEventListener("click", function(){
  $("src").value = "";
});
$("save").addEventListener("click", function(){
  var t = $("src").value.trim() || DEFAULT_TEXT;
  store("text", t);
  tokenize(t);
  $("editor").classList.remove("open");
  document.body.classList.remove("locked");
  setSheet(false);
  window.scrollTo(0, 0);
});

window.addEventListener("keydown", function(e){
  if (e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT") return;

  /* maths: type the answer on a keyboard too (handy on the Mac and the TV) */
  if (mode === "maths" && !sheetOpen() && !$("editor").classList.contains("open") &&
      !e.metaKey && !e.ctrlKey && !e.altKey){
    var onControl = e.target.closest && e.target.closest("button, select, a") && !e.target.closest("#pad");
    if (/^[0-9]$/.test(e.key)){ e.preventDefault(); typeDigit(e.key); return; }
    if (e.key === "Backspace"){ e.preventDefault(); deleteDigit(); return; }
    if (!onControl && (e.key === "Enter" || e.key === "=")){ e.preventDefault(); checkAnswer(); return; }
  }

  /* words: Space or Enter for Random, arrows spin, + and − zoom, Esc closes the big word */
  if (mode === "words" && !sheetOpen() && !e.metaKey && !e.ctrlKey && !e.altKey){
    var onOther = e.target.closest && e.target.closest("button, select, a") && e.target.id !== "wordRandom";
    if (!onOther && (e.key === "Enter" || e.code === "Space")){ e.preventDefault(); Words.random(); return; }
    if (/^Arrow(Left|Right|Up|Down)$/.test(e.key)){ e.preventDefault(); Words.nudge(e.key); return; }
    if (e.key === "+" || e.key === "="){ e.preventDefault(); Words.zoomBy(1.25); return; }
    if (e.key === "-" || e.key === "_"){ e.preventDefault(); Words.zoomBy(0.8); return; }
    if (e.key === "Escape" && Words.cardOpen()){ Words.closeCard(); return; }
  }

  if (e.code === "Space"){ e.preventDefault(); if (mode === "reading") play(); }
  if (e.key === "Escape"){
    stopAll(); clearWord(); setLive(-1);
    if ($("editor").classList.contains("open")){
      $("editor").classList.remove("open");
      document.body.classList.remove("locked");
    } else {
      setSheet(false);
    }
  }
});

/* ---------------- start ---------------- */

if (synth){ pickVoice(); synth.onvoiceschanged = pickVoice; }
setBand(parseInt(recall("band","0"), 10) || 0);
tokenize(recall("text", DEFAULT_TEXT));
setSheet(false);
setMode(recall("mode", "reading"));

})();
